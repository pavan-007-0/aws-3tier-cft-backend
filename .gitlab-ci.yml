image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  FRONTEND_REPO: frontend-repo
  IMAGE_TAG: latest
  STACK_NAME: ecs-ecommerce-stack

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - aws sts get-caller-identity
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  - echo "AWS Account ID is $AWS_ACCOUNT_ID"
  - echo "Region is $AWS_DEFAULT_REGION"

build-backend:
  stage: build
  script:
    - echo "Creating backend ECR repository..."
    - aws ecr describe-repositories --repository-names $BACKEND_REPO --region $AWS_DEFAULT_REGION 2>/dev/null || aws ecr create-repository --repository-name $BACKEND_REPO --region $AWS_DEFAULT_REGION
    - echo "Logging into ECR..."
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
    - echo "Building backend Docker image..."
    - docker build -t $BACKEND_REPO:$IMAGE_TAG .
    - docker tag $BACKEND_REPO:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG
    - echo "Pushing backend image to ECR..."
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG
    - echo "✅ Backend image pushed successfully!"
  only:
    - main

deploy-infrastructure:
  stage: deploy
  script:
    - echo "Ensuring frontend ECR repository exists..."
    - aws ecr describe-repositories --repository-names $FRONTEND_REPO --region $AWS_DEFAULT_REGION 2>/dev/null || aws ecr create-repository --repository-name $FRONTEND_REPO --region $AWS_DEFAULT_REGION
    - echo "Creating CloudFormation template..."
    - cat > ecs-infra.yaml << 'EOFTEMPLATE'
    - 'AWSTemplateFormatVersion: "2010-09-09"'
    - 'Description: ECS Fargate Frontend and Backend with separate ALBs'
    - ''
    - 'Parameters:'
    - '  FrontendImageURI:'
    - '    Type: String'
    - '  BackendImageURI:'
    - '    Type: String'
    - ''
    - 'Resources:'
    - '  VPC:'
    - '    Type: AWS::EC2::VPC'
    - '    Properties:'
    - '      CidrBlock: 10.0.0.0/16'
    - '      EnableDnsSupport: true'
    - '      EnableDnsHostnames: true'
    - '  InternetGateway:'
    - '    Type: AWS::EC2::InternetGateway'
    - '  IGWAttachment:'
    - '    Type: AWS::EC2::VPCGatewayAttachment'
    - '    Properties:'
    - '      VpcId: !Ref VPC'
    - '      InternetGatewayId: !Ref InternetGateway'
    - '  PublicSubnet1:'
    - '    Type: AWS::EC2::Subnet'
    - '    Properties:'
    - '      VpcId: !Ref VPC'
    - '      AvailabilityZone: ap-south-1a'
    - '      CidrBlock: 10.0.0.0/20'
    - '      MapPublicIpOnLaunch: true'
    - '  PublicSubnet2:'
    - '    Type: AWS::EC2::Subnet'
    - '    Properties:'
    - '      VpcId: !Ref VPC'
    - '      AvailabilityZone: ap-south-1b'
    - '      CidrBlock: 10.0.16.0/20'
    - '      MapPublicIpOnLaunch: true'
    - '  PublicRouteTable:'
    - '    Type: AWS::EC2::RouteTable'
    - '    Properties:'
    - '      VpcId: !Ref VPC'
    - '  PublicRoute:'
    - '    Type: AWS::EC2::Route'
    - '    DependsOn: IGWAttachment'
    - '    Properties:'
    - '      RouteTableId: !Ref PublicRouteTable'
    - '      DestinationCidrBlock: 0.0.0.0/0'
    - '      GatewayId: !Ref InternetGateway'
    - '  PublicSubnet1Route:'
    - '    Type: AWS::EC2::SubnetRouteTableAssociation'
    - '    Properties:'
    - '      SubnetId: !Ref PublicSubnet1'
    - '      RouteTableId: !Ref PublicRouteTable'
    - '  PublicSubnet2Route:'
    - '    Type: AWS::EC2::SubnetRouteTableAssociation'
    - '    Properties:'
    - '      SubnetId: !Ref PublicSubnet2'
    - '      RouteTableId: !Ref PublicRouteTable'
    - '  ALBSecurityGroup:'
    - '    Type: AWS::EC2::SecurityGroup'
    - '    Properties:'
    - '      GroupDescription: Allow HTTP from internet'
    - '      VpcId: !Ref VPC'
    - '      SecurityGroupIngress:'
    - '        - IpProtocol: tcp'
    - '          FromPort: 80'
    - '          ToPort: 80'
    - '          CidrIp: 0.0.0.0/0'
    - '  ECSTaskSecurityGroup:'
    - '    Type: AWS::EC2::SecurityGroup'
    - '    Properties:'
    - '      GroupDescription: Allow traffic from ALB'
    - '      VpcId: !Ref VPC'
    - '      SecurityGroupIngress:'
    - '        - IpProtocol: tcp'
    - '          FromPort: 80'
    - '          ToPort: 80'
    - '          SourceSecurityGroupId: !Ref ALBSecurityGroup'
    - '        - IpProtocol: tcp'
    - '          FromPort: 5000'
    - '          ToPort: 5000'
    - '          SourceSecurityGroupId: !Ref ALBSecurityGroup'
    - '  ECSTaskExecutionRole:'
    - '    Type: AWS::IAM::Role'
    - '    Properties:'
    - '      AssumeRolePolicyDocument:'
    - '        Version: "2012-10-17"'
    - '        Statement:'
    - '          - Effect: Allow'
    - '            Principal:'
    - '              Service: ecs-tasks.amazonaws.com'
    - '            Action: sts:AssumeRole'
    - '      ManagedPolicyArns:'
    - '        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy'
    - '  ECSCluster:'
    - '    Type: AWS::ECS::Cluster'
    - '  FrontendTaskDefinition:'
    - '    Type: AWS::ECS::TaskDefinition'
    - '    Properties:'
    - '      Cpu: "256"'
    - '      Memory: "512"'
    - '      NetworkMode: awsvpc'
    - '      RequiresCompatibilities:'
    - '        - FARGATE'
    - '      ExecutionRoleArn: !Ref ECSTaskExecutionRole'
    - '      ContainerDefinitions:'
    - '        - Name: frontend'
    - '          Image: !Ref FrontendImageURI'
    - '          PortMappings:'
    - '            - ContainerPort: 80'
    - '  FrontendTargetGroup:'
    - '    Type: AWS::ElasticLoadBalancingV2::TargetGroup'
    - '    Properties:'
    - '      VpcId: !Ref VPC'
    - '      Protocol: HTTP'
    - '      Port: 80'
    - '      TargetType: ip'
    - '      HealthCheckPath: /'
    - '      HealthCheckIntervalSeconds: 60'
    - '      HealthCheckTimeoutSeconds: 30'
    - '      HealthyThresholdCount: 2'
    - '      UnhealthyThresholdCount: 5'
    - '      Matcher:'
    - '        HttpCode: 200-499'
    - '  FrontendALB:'
    - '    Type: AWS::ElasticLoadBalancingV2::LoadBalancer'
    - '    Properties:'
    - '      Scheme: internet-facing'
    - '      Subnets:'
    - '        - !Ref PublicSubnet1'
    - '        - !Ref PublicSubnet2'
    - '      SecurityGroups:'
    - '        - !Ref ALBSecurityGroup'
    - '  FrontendListener:'
    - '    Type: AWS::ElasticLoadBalancingV2::Listener'
    - '    Properties:'
    - '      LoadBalancerArn: !Ref FrontendALB'
    - '      Port: 80'
    - '      Protocol: HTTP'
    - '      DefaultActions:'
    - '        - Type: forward'
    - '          TargetGroupArn: !Ref FrontendTargetGroup'
    - '  FrontendService:'
    - '    Type: AWS::ECS::Service'
    - '    DependsOn: FrontendListener'
    - '    Properties:'
    - '      Cluster: !Ref ECSCluster'
    - '      LaunchType: FARGATE'
    - '      DesiredCount: 1'
    - '      TaskDefinition: !Ref FrontendTaskDefinition'
    - '      HealthCheckGracePeriodSeconds: 300'
    - '      NetworkConfiguration:'
    - '        AwsvpcConfiguration:'
    - '          AssignPublicIp: ENABLED'
    - '          Subnets:'
    - '            - !Ref PublicSubnet1'
    - '            - !Ref PublicSubnet2'
    - '          SecurityGroups:'
    - '            - !Ref ECSTaskSecurityGroup'
    - '      LoadBalancers:'
    - '        - ContainerName: frontend'
    - '          ContainerPort: 80'
    - '          TargetGroupArn: !Ref FrontendTargetGroup'
    - '  BackendTaskDefinition:'
    - '    Type: AWS::ECS::TaskDefinition'
    - '    Properties:'
    - '      Cpu: "256"'
    - '      Memory: "512"'
    - '      NetworkMode: awsvpc'
    - '      RequiresCompatibilities:'
    - '        - FARGATE'
    - '      ExecutionRoleArn: !Ref ECSTaskExecutionRole'
    - '      ContainerDefinitions:'
    - '        - Name: backend'
    - '          Image: !Ref BackendImageURI'
    - '          PortMappings:'
    - '            - ContainerPort: 5000'
    - '          Environment:'
    - '            - Name: DB_HOST'
    - '              Value: database-1.c7k0u8mcq7i1.ap-south-1.rds.amazonaws.com'
    - '            - Name: DB_NAME'
    - '              Value: ecommerce_db'
    - '            - Name: DB_USER'
    - '              Value: admin'
    - '            - Name: DB_PASSWORD'
    - '              Value: ":c-*EA9T$(xkkH7Iy$KsDw78dHg["'
    - '            - Name: DB_PORT'
    - '              Value: "3306"'
    - '            - Name: FLASK_ENV'
    - '              Value: production'
    - '            - Name: JWT_SECRET_KEY'
    - '              Value: jwt-secret-key'
    - '            - Name: SECRET_KEY'
    - '              Value: super-secret-key'
    - '            - Name: PORT'
    - '              Value: "5000"'
    - '  BackendTargetGroup:'
    - '    Type: AWS::ElasticLoadBalancingV2::TargetGroup'
    - '    Properties:'
    - '      VpcId: !Ref VPC'
    - '      Protocol: HTTP'
    - '      Port: 5000'
    - '      TargetType: ip'
    - '      HealthCheckPath: /'
    - '      HealthCheckIntervalSeconds: 60'
    - '      HealthCheckTimeoutSeconds: 30'
    - '      HealthyThresholdCount: 2'
    - '      UnhealthyThresholdCount: 5'
    - '      Matcher:'
    - '        HttpCode: 200-499'
    - '  BackendALB:'
    - '    Type: AWS::ElasticLoadBalancingV2::LoadBalancer'
    - '    Properties:'
    - '      Scheme: internet-facing'
    - '      Subnets:'
    - '        - !Ref PublicSubnet1'
    - '        - !Ref PublicSubnet2'
    - '      SecurityGroups:'
    - '        - !Ref ALBSecurityGroup'
    - '  BackendListener:'
    - '    Type: AWS::ElasticLoadBalancingV2::Listener'
    - '    Properties:'
    - '      LoadBalancerArn: !Ref BackendALB'
    - '      Port: 80'
    - '      Protocol: HTTP'
    - '      DefaultActions:'
    - '        - Type: forward'
    - '          TargetGroupArn: !Ref BackendTargetGroup'
    - '  BackendService:'
    - '    Type: AWS::ECS::Service'
    - '    DependsOn: BackendListener'
    - '    Properties:'
    - '      Cluster: !Ref ECSCluster'
    - '      LaunchType: FARGATE'
    - '      DesiredCount: 1'
    - '      TaskDefinition: !Ref BackendTaskDefinition'
    - '      HealthCheckGracePeriodSeconds: 300'
    - '      NetworkConfiguration:'
    - '        AwsvpcConfiguration:'
    - '          AssignPublicIp: ENABLED'
    - '          Subnets:'
    - '            - !Ref PublicSubnet1'
    - '            - !Ref PublicSubnet2'
    - '          SecurityGroups:'
    - '            - !Ref ECSTaskSecurityGroup'
    - '      LoadBalancers:'
    - '        - ContainerName: backend'
    - '          ContainerPort: 5000'
    - '          TargetGroupArn: !Ref BackendTargetGroup'
    - 'Outputs:'
    - '  FrontendURL:'
    - '    Value: !GetAtt FrontendALB.DNSName'
    - '  BackendURL:'
    - '    Value: !GetAtt BackendALB.DNSName'
    - EOFTEMPLATE
    - echo "Deploying CloudFormation stack..."
    - aws cloudformation deploy --stack-name $STACK_NAME --template-file ecs-infra.yaml --capabilities CAPABILITY_NAMED_IAM --parameter-overrides FrontendImageURI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_REPO:$IMAGE_TAG BackendImageURI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG --no-fail-on-empty-changeset
    - echo "✅ Deployment complete!"
    - echo ""
    - aws cloudformation describe-stacks --stack-name $STACK_NAME --query 'Stacks[0].Outputs' --output table
    - echo ""
    - echo "Check logs with:"
    - echo "aws logs tail /ecs/backend --follow --region ap-south-1"
  needs:
    - build-backend
  only:
    - main