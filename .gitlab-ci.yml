image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_REGION: us-east-1
  BACKEND_ECR_REPO: backend-repo
  FRONTEND_ECR_REPO: frontend-repo
  IMAGE_TAG: latest
  STACK_NAME: ecommerce-fargate-test

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - aws sts get-caller-identity

# ---------------- BUILD BACKEND IMAGE ----------------
build-backend:
  stage: build
  script:
    - |
      aws ecr describe-repositories \
        --repository-names $BACKEND_ECR_REPO \
        --region $AWS_REGION \
      || aws ecr create-repository \
        --repository-name $BACKEND_ECR_REPO \
        --region $AWS_REGION
    - aws ecr get-login-password --region $AWS_REGION |
      docker login --username AWS --password-stdin \
      $CI_AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
    - docker build -t $BACKEND_ECR_REPO:$IMAGE_TAG .
    - docker tag $BACKEND_ECR_REPO:$IMAGE_TAG \
      $CI_AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_ECR_REPO:$IMAGE_TAG
    - docker push \
      $CI_AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_ECR_REPO:$IMAGE_TAG
  only:
    - main

# ---------------- DEPLOY FULL INFRA ----------------
deploy-infra:
  stage: deploy
  script:
    - |
      aws cloudformation deploy \
        --stack-name $STACK_NAME \
        --template-file infra/ecs-fargate.yaml \
        --capabilities CAPABILITY_NAMED_IAM \
        --parameter-overrides \
          BackendImageURI=$CI_AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_ECR_REPO:$IMAGE_TAG \
          FrontendImageURI=$CI_AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_ECR_REPO:$IMAGE_TAG
  only:
    - main
