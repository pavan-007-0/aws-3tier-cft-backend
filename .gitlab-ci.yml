image: docker:24
services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  CLUSTER_NAME: ecommerce-cluster

stages:
  - build
  - infra
  - deploy

build-backend:
  stage: build
  before_script:
    - apk add --no-cache aws-cli
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - aws ecr describe-repositories --repository-names "$BACKEND_REPO" || aws ecr create-repository --repository-name "$BACKEND_REPO"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
  only:
    - main

provision-eks:
  stage: infra
  needs: ["build-backend"]
  image: alpine:3.18
  before_script:
    - apk add --no-cache aws-cli curl bash openssl jq
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - curl -sL "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" | tar xz -C /usr/local/bin
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x kubectl && mv kubectl /usr/local/bin/
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script:
    # FIX IAM permissions automatically
    - |
      echo "🔧 Auto-fixing NodeGroup IAM permissions..."
      NODE_ROLE=$(aws iam list-roles --query 'Roles[?contains(RoleName, `ecommerce-cluster-nodegroup`)]|[0].RoleName' --output text 2>/dev/null || echo "none")
      if [ "$NODE_ROLE" != "none" ]; then
        aws iam attach-role-policy --role-name "$NODE_ROLE" --policy-arn arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess || true
        echo "✅ ELB permissions added: $NODE_ROLE"
      fi

    # EKS cluster config with correct IAM
    - |
      cat > cluster-config.yaml << EOF
      apiVersion: eksctl.io/v1alpha5
      kind: ClusterConfig
      metadata:
        name: ${CLUSTER_NAME}
        region: ${AWS_DEFAULT_REGION}
        version: "1.30"
      iam:
        withOIDC: true
        serviceAccounts:
          - metadata:
              name: aws-load-balancer-controller
              namespace: kube-system
            attachPolicyARNs:
              - arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess
      vpc:
        id: vpc-0c94c781bb54a1008
        subnets:
          public:
            us-east-1a: {id: subnet-0951f168b0769217c}
            us-east-1b: {id: subnet-0a61c37122c11d0f1}
      managedNodeGroups:
        - name: ecommerce-nodes
          instanceType: t3.small
          minSize: 1
          desiredCapacity: 2
          iam:
            attachPolicyARNs:
              - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
              - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
              - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
              - arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess
      EOF

    # Create/update cluster
    - aws ec2 modify-subnet-attribute --subnet-id subnet-0951f168b0769217c --map-public-ip-on-launch || true
    - aws ec2 modify-subnet-attribute --subnet-id subnet-0a61c37122c11d0f1 --map-public-ip-on-launch || true
    - |
      if aws eks describe-cluster --name "$CLUSTER_NAME" >/dev/null 2>&1; then
        echo "✅ Cluster exists"
        eksctl utils update-cluster-iam-roles -f cluster-config.yaml --approve || true
      else
        echo "🚀 Creating cluster..."
        eksctl create cluster -f cluster-config.yaml
      fi
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"

    # Install ALB Controller
    - |
      helm repo add eks https://aws.github.io/eks-charts || true
      helm repo update
      helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
        -n kube-system --create-namespace \
        --set clusterName=$CLUSTER_NAME \
        --set serviceAccount.create=true \
        --set region=$AWS_DEFAULT_REGION \
        --set vpcId=vpc-0c94c781bb54a1008 \
        --wait --timeout=5m || true
      kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=120s || true

    # External Secrets (your existing setup)
    - |
      helm repo add external-secrets https://charts.external-secrets.io || true
      helm repo update
      helm upgrade --install external-secrets external-secrets/external-secrets \
        -n external-secrets --create-namespace \
        --set installCRDs=true \
        --set serviceAccount.create=true || true
      kubectl apply -f- << EOF
      apiVersion: external-secrets.io/v1beta1
      kind: ClusterSecretStore
      metadata:
        name: aws-secrets-manager
      spec:
        provider:
          aws:
            service: SecretsManager
            region: us-east-1
            auth:
              jwt:
                serviceAccountRef:
                  name: external-secrets-sa
                  namespace: external-secrets
      EOF
  only:
    - main

deploy-backend:
  stage: deploy
  needs: ["provision-eks"]
  image: alpine:3.18
  before_script:
    - apk add --no-cache aws-cli curl bash jq
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x kubectl && mv kubectl /usr/local/bin/
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"
  script:
    # Deploy backend manifests
    - |
      cat > backend-manifests.yaml << EOF
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: default
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: backend
        template:
          metadata:
            labels:
              app: backend
          spec:
            containers:
            - name: backend
              image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${BACKEND_REPO}:${IMAGE_TAG}
              ports:
              - containerPort: 5000
              env:
              - name: DB_HOST
                value: "database-1.cujgu046ilz9.us-east-1.rds.amazonaws.com"
              - name: DB_NAME
                value: "ecommerce_db"
              - name: FLASK_ENV
                value: "production"
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_USER
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_PASSWORD
              - name: JWT_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: JWT_SECRET_KEY
              - name: SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: SECRET_KEY
              livenessProbe:
                httpGet:
                  path: /health
                  port: 5000
                initialDelaySeconds: 30
              readinessProbe:
                httpGet:
                  path: /health
                  port: 5000
                initialDelaySeconds: 20
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        namespace: default
      spec:
        selector:
          app: backend
        ports:
        - port: 5000
          targetPort: 5000
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: backend
        namespace: default
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
          alb.ingress.kubernetes.io/healthcheck-path: /health
          alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
          alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
          alb.ingress.kubernetes.io/healthy-threshold-count: "3"
          alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
      spec:
        rules:
        - http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: backend
                  port:
                    number: 5000
      EOF

    - kubectl apply -f backend-manifests.yaml
    - kubectl rollout status deployment/backend -n default --timeout=300s
    - |
      echo "⏳ Waiting for ALB provisioning (5 mins max)..."
      for i in {1..300}; do
        BACKEND_URL=$(kubectl get ingress backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
        if [ -n "$BACKEND_URL" ]; then
          echo "🎉 BACKEND LIVE: http://$BACKEND_URL"
          sleep 5
          curl -f -m 10 "http://$BACKEND_URL/health" && echo "✅ Health check PASSED!" && break
        fi
        echo "⏳ ALB ready in $((300-i))s... ($i/300)"
        sleep 1
      done
    - kubectl get ingress backend -n default -o wide
    - echo "🚀 Production deployment COMPLETE!"
  only:
    - main
