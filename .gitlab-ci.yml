stages:
  - validate
  - infra
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  CLUSTER_NAME: ecommerce-cluster
  VPC_ID: "vpc-08154df9a2d395b74"
  SUBNET_A: "subnet-08069b38b8523e498"
  SUBNET_B: "subnet-09f6c7704fb913937"
  RDS_SG_ID: "sg-0f5f53246f5b20572"
  RDS_ENDPOINT: "database-1.coxucmkk0rho.us-east-1.rds.amazonaws.com"
  SECRET_APP_ARN: "arn:aws:secretsmanager:us-east-1:650251731987:secret:secrets/backend/app-jrGxUC"
  SECRET_RDS_ARN: "arn:aws:secretsmanager:us-east-1:650251731987:secret:rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab-kVLItg"
  NODE_INSTANCE_TYPE: "t3.medium"
  NODE_MIN: "1"
  NODE_MAX: "3"
  NODE_DESIRED: "2"

# ==========================
# STAGE 1 - VALIDATE
# ==========================

validate-aws-credentials:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - echo "Validating AWS credentials..."
    - aws sts get-caller-identity
    - echo "Checking region is reachable..."
    - aws ec2 describe-availability-zones --region "$AWS_DEFAULT_REGION" --query "AvailabilityZones[0].State" --output text
    - echo "Verifying VPC exists..."
    - aws ec2 describe-vpcs --vpc-ids "$VPC_ID" --query "Vpcs[0].VpcId" --output text
    - echo "Verifying subnets exist..."
    - aws ec2 describe-subnets --subnet-ids "$SUBNET_A" "$SUBNET_B" --query "Subnets[*].SubnetId" --output text
    - echo "Verifying RDS security group exists..."
    - aws ec2 describe-security-groups --group-ids "$RDS_SG_ID" --query "SecurityGroups[0].GroupId" --output text
    - echo "Verifying Secrets Manager secrets exist..."
    - aws secretsmanager describe-secret --secret-id "secrets/backend/app" --query "Name" --output text
    - aws secretsmanager describe-secret --secret-id "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab" --query "Name" --output text
    - echo "All AWS infrastructure checks passed"
  only:
    - main

validate-python-code:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y python3-pip
    - pip3 install pyflakes bandit pylint flask flask-cors flask-limiter flask-wtf mysql-connector-python python-dotenv PyJWT Werkzeug cryptography bcrypt marshmallow email-validator requests gunicorn
  script:
    - echo "Checking Python syntax on all .py files..."
    - |
      SYNTAX_ERRORS=0
      for f in $(find . -name "*.py" -not -path "./__pycache__/*"); do
        python3 -m py_compile "$f" 2>&1
        if [ $? -ne 0 ]; then
          echo "SYNTAX ERROR in $f"
          SYNTAX_ERRORS=$((SYNTAX_ERRORS + 1))
        else
          echo "OK: $f"
        fi
      done
      if [ $SYNTAX_ERRORS -gt 0 ]; then
        echo "$SYNTAX_ERRORS file(s) have syntax errors. Fix before pushing."
        exit 1
      fi
      echo "All Python files passed syntax check"

    - echo "Running pyflakes for undefined names and unused imports..."
    - |
      python3 -m pyflakes app.py auth.py db.py orders.py products.py cart.py admin.py security.py error_handlers.py 2>&1 || true

    - echo "Running bandit security scan..."
    - |
      python3 -m bandit -r . -x ./__pycache__ --severity-level medium -f txt 2>&1 || true

    - echo "Python validation complete"
  only:
    - main

validate-docker:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y python3-pip
    - pip3 install dockerfile-parse
  script:
    - echo "Checking Dockerfile exists..."
    - test -f Dockerfile || (echo "ERROR Dockerfile not found" && exit 1)
    - |
      python3 << 'PYEOF'
      from dockerfile_parse import DockerfileParser
      try:
          dfp = DockerfileParser(path='.')
          print(f"Base image: {dfp.baseimage}")
          print(f"Total instructions: {len(dfp.structure)}")
          required = ['FROM', 'WORKDIR', 'COPY', 'RUN', 'CMD']
          found = [s['instruction'] for s in dfp.structure]
          for r in required:
              if r in found:
                  print(f"OK: {r} instruction found")
              else:
                  print(f"WARNING: {r} instruction not found")
          print("Dockerfile validation passed")
      except Exception as e:
          print(f"ERROR: {e}")
          exit(1)
      PYEOF
    - echo "Checking requirements.txt exists..."
    - test -f requirements.txt || (echo "ERROR requirements.txt not found" && exit 1)
    - echo "Validating requirements.txt is not empty..."
    - test -s requirements.txt || (echo "ERROR requirements.txt is empty" && exit 1)
    - echo "Docker validation passed"
  only:
    - main

# ==========================
# STAGE 2 - INFRA
# ==========================

infra-ecr:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - echo "Ensuring ECR repository exists..."
    - |
      aws ecr describe-repositories \
        --repository-names "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION" 2>/dev/null || \
      aws ecr create-repository \
        --repository-name "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION" \
        --image-scanning-configuration scanOnPush=true \
        --encryption-configuration encryptionType=AES256
    - echo "ECR repository ready"
  only:
    - main

infra-secrets:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - echo "Ensuring app secrets exist in Secrets Manager..."
    - |
      aws secretsmanager describe-secret \
        --secret-id "secrets/backend/app" \
        --region "$AWS_DEFAULT_REGION" 2>/dev/null || \
      aws secretsmanager create-secret \
        --name "secrets/backend/app" \
        --description "Backend app secrets" \
        --secret-string '{"JWT_SECRET_KEY":"change-me-jwt-secret","SECRET_KEY":"change-me-secret-key"}' \
        --region "$AWS_DEFAULT_REGION"
    - echo "Secrets ready"
  only:
    - main

infra-eks:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y tar gzip
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
    - tar -xzf eksctl_Linux_amd64.tar.gz && mv eksctl /usr/local/bin/
    - curl -sLO https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz
    - tar -xzf helm-v3.14.0-linux-amd64.tar.gz && mv linux-amd64/helm /usr/local/bin/
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - echo "Checking if EKS cluster exists..."
    - |
      CLUSTER_EXISTS=$(aws eks describe-cluster \
        --name "$CLUSTER_NAME" \
        --region "$AWS_DEFAULT_REGION" \
        --query "cluster.status" \
        --output text 2>&1 || echo "NOT_FOUND")

      if echo "$CLUSTER_EXISTS" | grep -q "NOT_FOUND\|ResourceNotFoundException"; then
        echo "Cluster not found. Creating EKS cluster with latest version..."
        EKS_VERSION=$(aws eks describe-addon-versions \
          --query "sort_by(addons[0].addonVersions, &addonVersion)[-1].compatibilities[0].clusterVersion" \
          --output text 2>/dev/null || echo "1.32")
        echo "Using EKS version: $EKS_VERSION"
        eksctl create cluster \
          --name "$CLUSTER_NAME" \
          --version "$EKS_VERSION" \
          --region "$AWS_DEFAULT_REGION" \
          --vpc-public-subnets "$SUBNET_A,$SUBNET_B" \
          --nodegroup-name backend-nodes \
          --node-type "$NODE_INSTANCE_TYPE" \
          --nodes "$NODE_DESIRED" \
          --nodes-min "$NODE_MIN" \
          --nodes-max "$NODE_MAX" \
          --managed \
          --alb-ingress-access \
          --full-ecr-access \
          --asg-access \
          --with-oidc
        echo "EKS cluster created"
      else
        echo "EKS cluster already exists - status: $CLUSTER_EXISTS"
      fi

    - echo "Updating kubeconfig..."
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"

    - echo "Installing AWS Load Balancer Controller..."
    - |
      POLICY_ARN=$(aws iam list-policies \
        --query "Policies[?PolicyName=='AWSLoadBalancerControllerIAMPolicy'].Arn" \
        --output text 2>/dev/null || echo "")

      if [ -z "$POLICY_ARN" ]; then
        curl -sLO https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json
        POLICY_ARN=$(aws iam create-policy \
          --policy-name AWSLoadBalancerControllerIAMPolicy \
          --policy-document file://iam_policy.json \
          --query "Policy.Arn" --output text)
        echo "ALB IAM policy created: $POLICY_ARN"
      else
        echo "ALB IAM policy already exists: $POLICY_ARN"
      fi

      eksctl create iamserviceaccount \
        --cluster "$CLUSTER_NAME" \
        --namespace kube-system \
        --name aws-load-balancer-controller \
        --attach-policy-arn "$POLICY_ARN" \
        --approve \
        --override-existing-serviceaccounts || true

      helm repo add eks https://aws.github.io/eks-charts
      helm repo update
      helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
        --namespace kube-system \
        --set clusterName="$CLUSTER_NAME" \
        --set serviceAccount.create=false \
        --set serviceAccount.name=aws-load-balancer-controller \
        --set region="$AWS_DEFAULT_REGION" \
        --set vpcId="$VPC_ID" \
        --wait || true
      echo "ALB controller installed"

    - echo "Installing External Secrets Operator..."
    - |
      helm repo add external-secrets https://charts.external-secrets.io
      helm repo update
      helm upgrade --install external-secrets external-secrets/external-secrets \
        --namespace external-secrets \
        --create-namespace \
        --wait || true
      echo "External Secrets Operator installed"

    - echo "Creating ExternalSecrets IAM policy and service account..."
    - |
      POLICY_ESO_ARN=$(aws iam list-policies \
        --query "Policies[?PolicyName=='ExternalSecretsPolicy'].Arn" \
        --output text 2>/dev/null || echo "")

      if [ -z "$POLICY_ESO_ARN" ]; then
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["secretsmanager:GetSecretValue","secretsmanager:DescribeSecret"],"Resource":"*"}]}' > /tmp/eso-policy.json
        POLICY_ESO_ARN=$(aws iam create-policy \
          --policy-name ExternalSecretsPolicy \
          --policy-document file:///tmp/eso-policy.json \
          --query "Policy.Arn" --output text)
        echo "ExternalSecrets IAM policy created: $POLICY_ESO_ARN"
      else
        echo "ExternalSecrets IAM policy already exists: $POLICY_ESO_ARN"
      fi

      eksctl create iamserviceaccount \
        --cluster "$CLUSTER_NAME" \
        --namespace external-secrets \
        --name external-secrets-sa \
        --attach-policy-arn "$POLICY_ESO_ARN" \
        --approve \
        --override-existing-serviceaccounts || true

    - echo "Creating ClusterSecretStore..."
    - |
      printf 'apiVersion: external-secrets.io/v1beta1\nkind: ClusterSecretStore\nmetadata:\n  name: aws-secrets-manager\nspec:\n  provider:\n    aws:\n      service: SecretsManager\n      region: %s\n      auth:\n        jwt:\n          serviceAccountRef:\n            name: external-secrets-sa\n            namespace: external-secrets\n' "$AWS_DEFAULT_REGION" > /tmp/cluster-secret-store.yaml
      kubectl apply -f /tmp/cluster-secret-store.yaml
      echo "ClusterSecretStore created"

    - echo "Verifying cluster health..."
    - kubectl get nodes
    - kubectl get pods -n kube-system
    - echo "EKS cluster fully ready"
  timeout: 40m
  only:
    - main

infra-rds-access:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  needs: ["infra-eks"]
  script:
    - echo "Configuring RDS security group access from EKS..."
    - |
      EKS_NODE_SG=$(aws eks describe-cluster \
        --name "$CLUSTER_NAME" \
        --query "cluster.resourcesVpcConfig.clusterSecurityGroupId" \
        --output text)
      echo "EKS cluster SG: $EKS_NODE_SG"

      RULE_EXISTS=$(aws ec2 describe-security-group-rules \
        --filters \
          Name="group-id",Values="$RDS_SG_ID" \
          Name="ip-permission.to-port",Values="3306" \
          Name="ip-permission.from-port",Values="3306" \
          Name="ip-permission.protocol",Values="tcp" \
          Name="ip-permission.user-id-group-pairs.group-id",Values="$EKS_NODE_SG" \
        --query "SecurityGroupRules" --output text 2>/dev/null || echo "")

      if [ -z "$RULE_EXISTS" ]; then
        aws ec2 authorize-security-group-ingress \
          --group-id "$RDS_SG_ID" \
          --protocol tcp \
          --port 3306 \
          --source-group "$EKS_NODE_SG" || true
        echo "RDS access granted from EKS nodes"
      else
        echo "RDS access rule already exists"
      fi
  only:
    - main

# ==========================
# STAGE 3 - BUILD
# ==========================

build-backend:
  stage: build
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: ["infra-ecr", "infra-eks", "validate-docker", "validate-python-code"]
  before_script:
    - yum install -y docker
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - echo "Image pushed to ECR successfully"
  only:
    - main

# ==========================
# STAGE 4 - DEPLOY
# ==========================

deploy-backend:
  stage: deploy
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  needs: ["build-backend", "infra-rds-access"]
  before_script:
    - yum install -y tar gzip gettext jq
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"
  script:
    - |
      FRONTEND_URL=$(aws cloudformation describe-stacks \
        --stack-name frontend-stack \
        --query "Stacks[0].Outputs[?OutputKey=='FrontendURL'].OutputValue" \
        --output text 2>/dev/null || echo "http://localhost:4200")
      echo "Frontend URL: $FRONTEND_URL"

      export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      printf 'apiVersion: external-secrets.io/v1beta1\nkind: ExternalSecret\nmetadata:\n  name: backend-secrets\n  namespace: default\nspec:\n  refreshInterval: 1h\n  secretStoreRef:\n    name: aws-secrets-manager\n    kind: ClusterSecretStore\n  target:\n    name: backend-secrets\n    creationPolicy: Owner\n  data:\n  - secretKey: DB_USER\n    remoteRef:\n      key: "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab"\n      property: username\n  - secretKey: DB_PASSWORD\n    remoteRef:\n      key: "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab"\n      property: password\n  - secretKey: JWT_SECRET_KEY\n    remoteRef:\n      key: "secrets/backend/app"\n      property: JWT_SECRET_KEY\n  - secretKey: SECRET_KEY\n    remoteRef:\n      key: "secrets/backend/app"\n      property: SECRET_KEY\n' > /tmp/external-secret.yaml

      cat > /tmp/backend-deployment.yaml << EOF
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: default
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: backend
        template:
          metadata:
            labels:
              app: backend
          spec:
            containers:
            - name: backend
              image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${BACKEND_REPO}:${IMAGE_TAG}
              ports:
              - containerPort: 5000
              env:
              - name: DB_HOST
                value: "${RDS_ENDPOINT}"
              - name: DB_NAME
                value: "ecommerce_db"
              - name: FLASK_ENV
                value: "production"
              - name: CORS_ORIGINS
                value: "${FRONTEND_URL}"
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_USER
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_PASSWORD
              - name: JWT_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: JWT_SECRET_KEY
              - name: SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: SECRET_KEY
              resources:
                requests:
                  cpu: "256m"
                  memory: "512Mi"
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        namespace: default
      spec:
        type: ClusterIP
        selector:
          app: backend
        ports:
        - port: 5000
          targetPort: 5000
          protocol: TCP
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: backend
        namespace: default
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/subnets: ${SUBNET_A}, ${SUBNET_B}
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
          alb.ingress.kubernetes.io/healthcheck-path: /health
      spec:
        rules:
        - http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: backend
                  port:
                    number: 5000
      EOF

      kubectl apply -f /tmp/external-secret.yaml
      kubectl apply -f /tmp/backend-deployment.yaml
      kubectl rollout status deployment/backend -n default --timeout=300s
      echo "Backend deployed successfully"

    - |
      echo "Waiting for ALB to provision..."
      for i in {1..120}; do
        BACKEND_URL=$(kubectl get ingress backend -n default \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -n "$BACKEND_URL" ]; then
          echo "BACKEND LIVE AT: http://$BACKEND_URL"
          break
        fi
        sleep 5
      done
  only:
    - main