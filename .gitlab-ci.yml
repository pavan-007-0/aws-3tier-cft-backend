image: amazon/aws-cli:2.17.0

stages:
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: "us-east-1"
  ECR_REPOSITORY_NAME: "ecommerce-backend"
  ECS_STACK_NAME: "ecommerce-ecs-stack"
  CFN_TEMPLATE_FILE: "infra/ecs-infra.yaml"  # path inside repo
  BACKEND_CONTAINER_PORT: "5000"

before_script:
  - aws --version
  - eval $(aws ecr get-login --no-include-email --region "$AWS_DEFAULT_REGION")

build_backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_DRIVER: overlay2
  script:
    - echo "Logging in to ECR"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - export IMAGE_TAG="$CI_COMMIT_SHORT_SHA"
    - export IMAGE_URI="$ECR_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPOSITORY_NAME:$IMAGE_TAG"
    - echo "Building image $IMAGE_URI"
    - docker build -t "$IMAGE_URI" .
    - docker push "$IMAGE_URI"
    - echo "IMAGE_URI=$IMAGE_URI" > image.env
  artifacts:
    reports:
      dotenv: image.env
  only:
    - main
    - master

deploy_backend:
  stage: deploy
  dependencies:
    - build_backend
  script:
    - source image.env
    - echo "Deploying stack $ECS_STACK_NAME with backend image $IMAGE_URI"
    - aws cloudformation deploy \
        --stack-name "$ECS_STACK_NAME" \
        --template-file "$CFN_TEMPLATE_FILE" \
        --capabilities CAPABILITY_NAMED_IAM \
        --parameter-overrides \
          BackendImageURI="$IMAGE_URI" \
          FrontendImageURI="placeholder-frontend-image" \
        --region "$AWS_DEFAULT_REGION"
  only:
    - main
    - master
