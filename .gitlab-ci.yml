image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  STACK_NAME: backend-stack
  LOG_GROUP_NAME: /ecs/backend

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - aws sts get-caller-identity
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

# ================= BUILD =================
build-backend:
  stage: build
  script:
    - aws ecr describe-repositories --repository-names "$BACKEND_REPO" || aws ecr create-repository --repository-name "$BACKEND_REPO"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
  only:
    - main

# ================= DEPLOY =================
deploy-backend:
  stage: deploy
  needs: ["build-backend"]
  script:
    # ✅ GUARANTEE LOG GROUP EXISTS (FIXES TaskFailedToStart)
    - |
      aws logs describe-log-groups \
        --log-group-name-prefix "$LOG_GROUP_NAME" \
        --region "$AWS_DEFAULT_REGION" \
      | grep "$LOG_GROUP_NAME" || \
      aws logs create-log-group \
        --log-group-name "$LOG_GROUP_NAME" \
        --region "$AWS_DEFAULT_REGION"

    - |
      cat > backend.yaml << 'EOF'
      AWSTemplateFormatVersion: "2010-09-09"
      Description: ECS Backend (Fargate + ALB + RDS + Secrets Manager)

      Parameters:
        ImageURI:
          Type: String
        DBHost:
          Type: String
        DBName:
          Type: String
        VpcId:
          Type: String
        SubnetA:
          Type: String
        SubnetB:
          Type: String
        RDSSecurityGroup:
          Type: String
        RDSSecretArn:
          Type: String
        AppSecretArn:
          Type: String

      Resources:
        ALBSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: ALB SG
            VpcId: !Ref VpcId
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 80
                ToPort: 80
                CidrIp: 0.0.0.0/0

        BackendSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: Backend ECS SG
            VpcId: !Ref VpcId
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 5000
                ToPort: 5000
                SourceSecurityGroupId: !Ref ALBSG

        AllowEcsToRds:
          Type: AWS::EC2::SecurityGroupIngress
          Properties:
            GroupId: !Ref RDSSecurityGroup
            IpProtocol: tcp
            FromPort: 3306
            ToPort: 3306
            SourceSecurityGroupId: !Ref BackendSG

        Cluster:
          Type: AWS::ECS::Cluster

        ExecutionRole:
          Type: AWS::IAM::Role
          Properties:
            AssumeRolePolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ecs-tasks.amazonaws.com
                  Action: sts:AssumeRole
            ManagedPolicyArns:
              - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
              - arn:aws:iam::aws:policy/SecretsManagerReadWrite

        TaskDef:
          Type: AWS::ECS::TaskDefinition
          Properties:
            Cpu: 256
            Memory: 512
            NetworkMode: awsvpc
            RequiresCompatibilities: [FARGATE]
            ExecutionRoleArn: !GetAtt ExecutionRole.Arn
            ContainerDefinitions:
              - Name: backend
                Image: !Ref ImageURI
                PortMappings:
                  - ContainerPort: 5000
                Environment:
                  - Name: DB_HOST
                    Value: database-1.cujgu046ilz9.us-east-1.rds.amazonaws.com
                  - Name: DB_NAME
                    Value: ecommerce_db
                Secrets:
                  # 🔐 RDS SECRET (CORRECT FORMAT)
                  - Name: DB_USER
                    ValueFrom: !Sub "${RDSSecretArn}:username::"
                  - Name: DB_PASSWORD
                    ValueFrom: !Sub "${RDSSecretArn}:password::"

                  # 🔐 APP SECRET
                  - Name: JWT_SECRET_KEY
                    ValueFrom: !Sub "${AppSecretArn}:JWT_SECRET_KEY::"
                  - Name: SECRET_KEY
                    ValueFrom: !Sub "${AppSecretArn}:SECRET_KEY::"

                LogConfiguration:
                  LogDriver: awslogs
                  Options:
                    awslogs-group: /ecs/backend
                    awslogs-region: us-east-1
                    awslogs-stream-prefix: ecs

        TG:
          Type: AWS::ElasticLoadBalancingV2::TargetGroup
          Properties:
            VpcId: !Ref VpcId
            Port: 5000
            Protocol: HTTP
            TargetType: ip
            HealthCheckPath: /health

        ALB:
          Type: AWS::ElasticLoadBalancingV2::LoadBalancer
          Properties:
            Scheme: internet-facing
            Subnets: [!Ref SubnetA, !Ref SubnetB]
            SecurityGroups: [!Ref ALBSG]

        Listener:
          Type: AWS::ElasticLoadBalancingV2::Listener
          Properties:
            LoadBalancerArn: !Ref ALB
            Port: 80
            Protocol: HTTP
            DefaultActions:
              - Type: forward
                TargetGroupArn: !Ref TG

        Service:
          Type: AWS::ECS::Service
          DependsOn: Listener
          Properties:
            Cluster: !Ref Cluster
            LaunchType: FARGATE
            DesiredCount: 1
            TaskDefinition: !Ref TaskDef
            NetworkConfiguration:
              AwsvpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets: [!Ref SubnetA, !Ref SubnetB]
                SecurityGroups: [!Ref BackendSG]
            LoadBalancers:
              - ContainerName: backend
                ContainerPort: 5000
                TargetGroupArn: !Ref TG

      Outputs:
        BackendURL:
          Value: !GetAtt ALB.DNSName
      EOF

    - |
      aws cloudformation deploy \
        --stack-name "$STACK_NAME" \
        --template-file backend.yaml \
        --capabilities CAPABILITY_NAMED_IAM \
        --parameter-overrides \
        ImageURI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG" \
        DBHost="database-1-use1.cujgu046ilz9.us-east-1.rds.amazonaws.com" \
        DBName="ecommerce_db" \
        VpcId="vpc-0c94c781bb54a1008" \
        SubnetA="subnet-0951f168b0769217c" \
        SubnetB="subnet-0a61c37122c11d0f1" \
        RDSSecurityGroup="sg-0f5f53246f5b20572" \
        RDSSecretArn="arn:aws:secretsmanager:us-east-1:088042034531:secret:rds!db-bc9e1596-3d78-4991-8bd9-58e17d3073c1-cFksCL" \
        AppSecretArn="arn:aws:secretsmanager:us-east-1:088042034531:secret:secrets/app/backend-bkOeNX"
  only:
    - main
