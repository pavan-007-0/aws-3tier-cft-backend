image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  CLUSTER_NAME: ecommerce-cluster
  # Preserved from your CloudFormation parameters
  VPC_ID: "vpc-0c94c781bb54a1008"
  SUBNET_A: "subnet-0951f168b0769217c"
  SUBNET_B: "subnet-0a61c37122c11d0f1"
  RDS_SG_ID: "sg-0f5f53246f5b20572"

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli curl bash jq gettext
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

# ================= BUILD =================
build-backend:
  stage: build
  script:
    - aws ecr describe-repositories --repository-names "$BACKEND_REPO" || aws ecr create-repository --repository-name "$BACKEND_REPO"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
  only:
    - main

# ================= DEPLOY =================
deploy-backend:
  stage: deploy
  needs: ["build-backend"]
  script:
    # 1. Install kubectl
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    
    # 2. Update kubeconfig
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"

    # 3. Allow EKS Nodes to access RDS (Replaces 'AllowEcsToRds' CloudFormation rule)
    - |
      echo "🔐 Authorizing EKS nodes to access RDS Database..."
      EKS_NODE_SG=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query "cluster.resourcesVpcConfig.clusterSecurityGroupId" --output text)
      
      # Check if rule already exists to avoid errors
      RULE_EXISTS=$(aws ec2 describe-security-group-rules --filters Name="group-id",Values="$RDS_SG_ID" Name="ip-permission.to-port",Values="3306" Name="ip-permission.from-port",Values="3306" Name="ip-permission.protocol",Values="tcp" Name="ip-permission.user-id-group-pairs.group-id",Values="$EKS_NODE_SG" --query "SecurityGroupRules" --output text)
      
      if [ -z "$RULE_EXISTS" ]; then
        aws ec2 authorize-security-group-ingress --group-id "$RDS_SG_ID" --protocol tcp --port 3306 --source-group "$EKS_NODE_SG" || true
        echo "✅ Access granted from EKS ($EKS_NODE_SG) to RDS ($RDS_SG_ID)"
      else
        echo "✅ EKS to RDS security group rule already exists."
      fi

    # 4. Fetch Frontend URL for CORS (Preserved from old script)
    - |
      FRONTEND_URL=$(aws cloudformation describe-stacks --stack-name frontend-stack --query "Stacks[0].Outputs[?OutputKey=='FrontendURL'].OutputValue" --output text || echo "http://localhost:4200")
      echo "Detected Frontend URL: $FRONTEND_URL"

    # 5. Generate and Apply Kubernetes Manifests
    - |
      echo "📦 Deploying Kubernetes Manifests..."
      cat > backend-manifests.yaml << EOF
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: backend-secrets
        namespace: default
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: aws-secrets-manager
          kind: ClusterSecretStore
        target:
          name: backend-secrets
          create: true
        data:
        - secretKey: DB_USER
          remoteRef:
            key: "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab"
            property: username
        - secretKey: DB_PASSWORD
          remoteRef:
            key: "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab"
            property: password
        - secretKey: JWT_SECRET_KEY
          remoteRef:
            key: "secrets/backend/app"
            property: JWT_SECRET_KEY
        - secretKey: SECRET_KEY
          remoteRef:
            key: "secrets/backend/app"
            property: SECRET_KEY
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: default
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: backend
        template:
          metadata:
            labels:
              app: backend
          spec:
            containers:
            - name: backend
              image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${BACKEND_REPO}:${IMAGE_TAG}
              ports:
              - containerPort: 5000
              env:
              - name: DB_HOST
                value: "database-1.coxucmkk0rho.us-east-1.rds.amazonaws.com"
              - name: DB_NAME
                value: "ecommerce_db"
              - name: FLASK_ENV
                value: "production"
              - name: CORS_ORIGINS
                value: "${FRONTEND_URL}"
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_USER
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_PASSWORD
              - name: JWT_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: JWT_SECRET_KEY
              - name: SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: SECRET_KEY
              resources:
                requests:
                  cpu: "256m"
                  memory: "512Mi"
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        namespace: default
      spec:
        type: ClusterIP
        selector:
          app: backend
        ports:
        - port: 5000
          targetPort: 5000
          protocol: TCP
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: backend
        namespace: default
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/subnets: ${SUBNET_A}, ${SUBNET_B}
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
          alb.ingress.kubernetes.io/healthcheck-path: /health
      spec:
        rules:
        - http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: backend
                  port:
                    number: 5000
      EOF
      
      kubectl apply -f backend-manifests.yaml
      kubectl rollout status deployment/backend -n default --timeout=300s
      echo "✅ Backend successfully deployed to EKS!"

    # 6. Get the new ALB URL
    - |
      echo "⏳ Waiting for ALB Load Balancer to provision..."
      for i in {1..120}; do
        BACKEND_URL=$(kubectl get ingress backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -n "$BACKEND_URL" ]; then
          echo "🎉 BACKEND LIVE AT: http://$BACKEND_URL"
          break
        fi
        sleep 5
      done
  only:
    - main