image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  BACKEND_STACK: backend-stack

stages:
  - build
  - deploy

build-backend:
  stage: build
  script:
    - apk add --no-cache aws-cli
    - aws sts get-caller-identity
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

    # Ensure ECR repo exists (SAFE)
    - |
      aws ecr describe-repositories \
        --repository-names "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION" \
      || aws ecr create-repository \
        --repository-name "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION"

    # Login to ECR (NON-INTERACTIVE, CORRECT)
    - |
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | \
      docker login --username AWS --password-stdin \
      "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"

    # Build & push image
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" \
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push \
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
  only:
    - main

deploy-backend:
  stage: deploy
  script:
    - apk add --no-cache aws-cli
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

    # Generate CloudFormation template dynamically
    - |
      cat << 'EOF' > backend-infra.yaml
      AWSTemplateFormatVersion: "2010-09-09"
      Description: Backend ECS Fargate (minimal stable stack)

      Parameters:
        BackendImageURI:
          Type: String

      Resources:
        ECSCluster:
          Type: AWS::ECS::Cluster

        ExecutionRole:
          Type: AWS::IAM::Role
          Properties:
            AssumeRolePolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ecs-tasks.amazonaws.com
                  Action: sts:AssumeRole
            ManagedPolicyArns:
              - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

        TaskDefinition:
          Type: AWS::ECS::TaskDefinition
          Properties:
            Cpu: "256"
            Memory: "512"
            NetworkMode: awsvpc
            RequiresCompatibilities:
              - FARGATE
            ExecutionRoleArn: !GetAtt ExecutionRole.Arn
            ContainerDefinitions:
              - Name: backend
                Image: !Ref BackendImageURI
                PortMappings:
                  - ContainerPort: 5000
      EOF

    # Deploy CloudFormation stack
    - aws cloudformation deploy \
        --stack-name "$BACKEND_STACK" \
        --template-file backend-infra.yaml \
        --capabilities CAPABILITY_NAMED_IAM \
        --parameter-overrides BackendImageURI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG" \
        --no-fail-on-empty-changeset
  needs:
    - build-backend
  only:
    - main
