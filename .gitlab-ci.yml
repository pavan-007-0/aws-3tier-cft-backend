stages:
  - build
  - deploy

variables:
  REGION: "us-east-1"
  STACK_NAME: "ecommerce-infra-stack"
  # FIXED: Added the missing closing brace for the REGION variable
  ECR_URL: "${AWS_ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com"
  BACKEND_REPO: "ecommerce-backend"
  # Placeholder image for the first run
  FRONTEND_IMAGE: "${AWS_ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/ecommerce-frontend:latest"

before_script:
  - apk add --no-cache aws-cli
  - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $ECR_URL

build_backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t $ECR_URL/$BACKEND_REPO:$CI_COMMIT_SHA .
    - docker push $ECR_URL/$BACKEND_REPO:$CI_COMMIT_SHA
    - docker tag $ECR_URL/$BACKEND_REPO:$CI_COMMIT_SHA $ECR_URL/$BACKEND_REPO:latest
    - docker push $ECR_URL/$BACKEND_REPO:latest

deploy_infra:
  stage: deploy
  image: 
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - aws cloudformation deploy 
      --template-file ecs-infra.yaml 
      --stack-name $STACK_NAME 
      --parameter-overrides 
        BackendImageURI=$ECR_URL/$BACKEND_REPO:$CI_COMMIT_SHA 
        FrontendImageURI=$FRONTEND_IMAGE
      --capabilities CAPABILITY_NAMED_IAM