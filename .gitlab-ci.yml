stages:
  - validate
  - infra
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  CLUSTER_NAME: ecommerce-cluster
  VPC_ID: "vpc-0c94c781bb54a1008"
  SUBNET_A: "subnet-0951f168b0769217c"
  SUBNET_B: "subnet-0a61c37122c11d0f1"
  RDS_SG_ID: "sg-0f5f53246f5b20572"
  NODE_INSTANCE_TYPE: "t3.medium"
  NODE_MIN: "1"
  NODE_MAX: "3"
  NODE_DESIRED: "2"

# ==========================
# STAGE 1 - VALIDATE
# ==========================

validate-yaml:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y python3-pip
    - pip3 install yamllint
  script:
    - echo "Linting .gitlab-ci.yml..."
    - |
      cat > /tmp/.yamllint.yml << 'YAMLLINT_EOF'
      extends: relaxed
      rules:
        line-length:
          max: 200
      YAMLLINT_EOF
    - yamllint -c /tmp/.yamllint.yml .gitlab-ci.yml
    - echo "YAML syntax valid"
  only:
    - main

validate-aws-credentials:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - echo "Validating AWS credentials..."
    - aws sts get-caller-identity
    - echo "Region reachable..."
    - aws ec2 describe-availability-zones --region "$AWS_DEFAULT_REGION" --query "AvailabilityZones[0].State" --output text
    - echo "AWS credentials and region valid"
  only:
    - main

validate-docker:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y python3-pip
    - pip3 install dockerfile-parse
  script:
    - echo "Checking Dockerfile..."
    - test -f Dockerfile || (echo "ERROR Dockerfile not found" && exit 1)
    - |
      python3 << 'PYEOF'
      from dockerfile_parse import DockerfileParser
      try:
          dfp = DockerfileParser(path='.')
          print(f"Base image: {dfp.baseimage}")
          print(f"Instructions: {len(dfp.structure)}")
          print("Dockerfile syntax valid")
      except Exception as e:
          print(f"ERROR: {e}")
          exit(1)
      PYEOF
    - test -f requirements.txt || (echo "ERROR requirements.txt not found" && exit 1)
    - echo "Docker validation passed"
  only:
    - main

# ==========================
# STAGE 2 - INFRA
# ==========================

infra-ecr:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - echo "Ensuring ECR repository exists..."
    - |
      aws ecr describe-repositories \
        --repository-names "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION" 2>/dev/null || \
      aws ecr create-repository \
        --repository-name "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION" \
        --image-scanning-configuration scanOnPush=true \
        --encryption-configuration encryptionType=AES256
    - echo "ECR repository ready"
  only:
    - main

infra-secrets:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - echo "Ensuring Secrets Manager secret exists..."
    - |
      aws secretsmanager describe-secret \
        --secret-id "secrets/backend/app" \
        --region "$AWS_DEFAULT_REGION" 2>/dev/null || \
      aws secretsmanager create-secret \
        --name "secrets/backend/app" \
        --description "Backend app secrets" \
        --secret-string '{"JWT_SECRET_KEY":"change-me-jwt-secret","SECRET_KEY":"change-me-secret-key"}' \
        --region "$AWS_DEFAULT_REGION"
    - echo "Secret ready"
  only:
    - main

infra-eks:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y tar gzip
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
    - tar -xzf eksctl_Linux_amd64.tar.gz && mv eksctl /usr/local/bin/
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - echo "Checking if EKS cluster exists..."
    - |
      CLUSTER_EXISTS=$(aws eks describe-cluster \
        --name "$CLUSTER_NAME" \
        --region "$AWS_DEFAULT_REGION" \
        --query "cluster.status" \
        --output text 2>&1 || echo "NOT_FOUND")

      if echo "$CLUSTER_EXISTS" | grep -q "NOT_FOUND\|ResourceNotFoundException"; then
        echo "Cluster not found. Creating EKS cluster - this takes 15-20 mins..."
        eksctl create cluster \
          --name "$CLUSTER_NAME" \
          --region "$AWS_DEFAULT_REGION" \
          --vpc-public-subnets "$SUBNET_A,$SUBNET_B" \
          --nodegroup-name backend-nodes \
          --node-type "$NODE_INSTANCE_TYPE" \
          --nodes "$NODE_DESIRED" \
          --nodes-min "$NODE_MIN" \
          --nodes-max "$NODE_MAX" \
          --managed \
          --alb-ingress-access \
          --full-ecr-access \
          --asg-access \
          --with-oidc
        echo "EKS cluster created"
      else
        echo "EKS cluster already exists - status: $CLUSTER_EXISTS"
      fi

    - echo "Updating kubeconfig..."
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"

    - echo "Installing AWS Load Balancer Controller..."
    - |
      POLICY_ARN=$(aws iam list-policies \
        --query "Policies[?PolicyName=='AWSLoadBalancerControllerIAMPolicy'].Arn" \
        --output text)

      if [ -z "$POLICY_ARN" ]; then
        curl -sLO https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json
        POLICY_ARN=$(aws iam create-policy \
          --policy-name AWSLoadBalancerControllerIAMPolicy \
          --policy-document file://iam_policy.json \
          --query "Policy.Arn" --output text)
        echo "IAM policy created: $POLICY_ARN"
      else
        echo "IAM policy already exists: $POLICY_ARN"
      fi

      eksctl create iamserviceaccount \
        --cluster "$CLUSTER_NAME" \
        --namespace kube-system \
        --name aws-load-balancer-controller \
        --attach-policy-arn "$POLICY_ARN" \
        --approve \
        --override-existing-serviceaccounts || true

      curl -sLO https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz
      tar -xzf helm-v3.14.0-linux-amd64.tar.gz
      mv linux-amd64/helm /usr/local/bin/

      helm repo add eks https://aws.github.io/eks-charts
      helm repo update

      helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
        --namespace kube-system \
        --set clusterName="$CLUSTER_NAME" \
        --set serviceAccount.create=false \
        --set serviceAccount.name=aws-load-balancer-controller \
        --set region="$AWS_DEFAULT_REGION" \
        --set vpcId="$VPC_ID" \
        --wait || true

      echo "ALB controller installed"

    - echo "Installing External Secrets Operator..."
    - |
      curl -sLO https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz
      tar -xzf helm-v3.14.0-linux-amd64.tar.gz || true
      mv linux-amd64/helm /usr/local/bin/ 2>/dev/null || true

      helm repo add external-secrets https://charts.external-secrets.io
      helm repo update

      helm upgrade --install external-secrets external-secrets/external-secrets \
        --namespace external-secrets \
        --create-namespace \
        --wait || true

      echo "External Secrets Operator installed"

    - echo "Creating ExternalSecrets IAM policy and service account..."
    - |
      POLICY_ESO=$(aws iam list-policies \
        --query "Policies[?PolicyName=='ExternalSecretsPolicy'].Arn" \
        --output text)

      if [ -z "$POLICY_ESO" ]; then
        cat > /tmp/eso-policy.json << 'ESOPOLICY'
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Action": [
              "secretsmanager:GetSecretValue",
              "secretsmanager:DescribeSecret"
            ],
            "Resource": "*"
          }]
        }
        ESOPOLICY
        aws iam create-policy \
          --policy-name ExternalSecretsPolicy \
          --policy-document file:///tmp/eso-policy.json
        echo "ExternalSecrets IAM policy created"
      fi

      POLICY_ESO_ARN=$(aws iam list-policies \
        --query "Policies[?PolicyName=='ExternalSecretsPolicy'].Arn" \
        --output text)

      eksctl create iamserviceaccount \
        --cluster "$CLUSTER_NAME" \
        --namespace external-secrets \
        --name external-secrets-sa \
        --attach-policy-arn "$POLICY_ESO_ARN" \
        --approve \
        --override-existing-serviceaccounts || true

    - echo "Creating ClusterSecretStore..."
    - |
      cat > /tmp/cluster-secret-store.yaml << CSSEOF
      apiVersion: external-secrets.io/v1beta1
      kind: ClusterSecretStore
      metadata:
        name: aws-secrets-manager
      spec:
        provider:
          aws:
            service: SecretsManager
            region: ${AWS_DEFAULT_REGION}
            auth:
              jwt:
                serviceAccountRef:
                  name: external-secrets-sa
                  namespace: external-secrets
      CSSEOF
      kubectl apply -f /tmp/cluster-secret-store.yaml
      echo "ClusterSecretStore created"

    - echo "Verifying cluster is healthy..."
    - kubectl get nodes
    - echo "EKS cluster fully ready"
  timeout: 40m
  only:
    - main

infra-rds-access:
  stage: infra
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  needs: ["infra-eks"]
  script:
    - echo "Configuring RDS security group access from EKS..."
    - |
      EKS_NODE_SG=$(aws eks describe-cluster \
        --name "$CLUSTER_NAME" \
        --query "cluster.resourcesVpcConfig.clusterSecurityGroupId" \
        --output text)

      RULE_EXISTS=$(aws ec2 describe-security-group-rules \
        --filters \
          Name="group-id",Values="$RDS_SG_ID" \
          Name="ip-permission.to-port",Values="3306" \
          Name="ip-permission.from-port",Values="3306" \
          Name="ip-permission.protocol",Values="tcp" \
          Name="ip-permission.user-id-group-pairs.group-id",Values="$EKS_NODE_SG" \
        --query "SecurityGroupRules" --output text 2>/dev/null || echo "")

      if [ -z "$RULE_EXISTS" ]; then
        aws ec2 authorize-security-group-ingress \
          --group-id "$RDS_SG_ID" \
          --protocol tcp \
          --port 3306 \
          --source-group "$EKS_NODE_SG" || true
        echo "RDS access granted from EKS nodes"
      else
        echo "RDS access rule already exists"
      fi
  only:
    - main

# ==========================
# STAGE 3 - BUILD
# ==========================

build-backend:
  stage: build
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: ["infra-ecr", "infra-eks", "validate-docker"]
  before_script:
    - yum install -y docker
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - echo "Image pushed to ECR successfully"
  only:
    - main

# ==========================
# STAGE 4 - DEPLOY
# ==========================

deploy-backend:
  stage: deploy
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  needs: ["build-backend", "infra-rds-access"]
  before_script:
    - yum install -y tar gzip gettext jq
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"
  script:
    - |
      FRONTEND_URL=$(aws cloudformation describe-stacks \
        --stack-name frontend-stack \
        --query "Stacks[0].Outputs[?OutputKey=='FrontendURL'].OutputValue" \
        --output text 2>/dev/null || echo "http://localhost:4200")
      echo "Frontend URL: $FRONTEND_URL"

    - |
      echo "Deploying Kubernetes Manifests..."
      cat > /tmp/backend-manifests.yaml << EOF
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: backend-secrets
        namespace: default
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: aws-secrets-manager
          kind: ClusterSecretStore
        target:
          name: backend-secrets
          creationPolicy: Owner
        data:
        - secretKey: DB_USER
          remoteRef:
            key: "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab"
            property: username
        - secretKey: DB_PASSWORD
          remoteRef:
            key: "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab"
            property: password
        - secretKey: JWT_SECRET_KEY
          remoteRef:
            key: "secrets/backend/app"
            property: JWT_SECRET_KEY
        - secretKey: SECRET_KEY
          remoteRef:
            key: "secrets/backend/app"
            property: SECRET_KEY
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: default
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: backend
        template:
          metadata:
            labels:
              app: backend
          spec:
            containers:
            - name: backend
              image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${BACKEND_REPO}:${IMAGE_TAG}
              ports:
              - containerPort: 5000
              env:
              - name: DB_HOST
                value: "database-1.coxucmkk0rho.us-east-1.rds.amazonaws.com"
              - name: DB_NAME
                value: "ecommerce_db"
              - name: FLASK_ENV
                value: "production"
              - name: CORS_ORIGINS
                value: "${FRONTEND_URL}"
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_USER
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_PASSWORD
              - name: JWT_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: JWT_SECRET_KEY
              - name: SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: SECRET_KEY
              resources:
                requests:
                  cpu: "256m"
                  memory: "512Mi"
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        namespace: default
      spec:
        type: ClusterIP
        selector:
          app: backend
        ports:
        - port: 5000
          targetPort: 5000
          protocol: TCP
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: backend
        namespace: default
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/subnets: ${SUBNET_A}, ${SUBNET_B}
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
          alb.ingress.kubernetes.io/healthcheck-path: /health
      spec:
        rules:
        - http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: backend
                  port:
                    number: 5000
      EOF

      kubectl apply -f /tmp/backend-manifests.yaml
      kubectl rollout status deployment/backend -n default --timeout=300s
      echo "Backend deployed successfully"

    - |
      echo "Waiting for ALB to provision..."
      for i in {1..120}; do
        BACKEND_URL=$(kubectl get ingress backend -n default \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -n "$BACKEND_URL" ]; then
          echo "BACKEND LIVE AT: http://$BACKEND_URL"
          break
        fi
        sleep 5
      done
  only:
    - main