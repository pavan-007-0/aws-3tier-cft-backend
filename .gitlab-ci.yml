image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  STACK_NAME: backend-stack

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

# ================= BUILD =================
build-backend:
  stage: build
  script:
    - aws ecr describe-repositories --repository-names "$BACKEND_REPO" || aws ecr create-repository --repository-name "$BACKEND_REPO"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
  only:
    - main

# ================= DEPLOY =================
deploy-backend:
  stage: deploy
  needs: ["build-backend"]
  script:
    - |
      cat > backend.yaml << 'EOF'
      AWSTemplateFormatVersion: "2010-09-09"
      Description: ECS Backend (Existing VPC + Existing RDS)

      Parameters:
        ImageURI:
          Type: String
        DBHost:
          Type: String
        DBUser:
          Type: String
        DBPassword:
          Type: String
          NoEcho: true
        DBName:
          Type: String
        VpcId:
          Type: String
        PublicSubnetA:
          Type: String
        PublicSubnetB:
          Type: String
        ExistingRDSSG:
          Type: String

      Resources:
        ALBSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: ALB SG
            VpcId: !Ref VpcId
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 80
                ToPort: 80
                CidrIp: 0.0.0.0/0

        BackendSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: Backend ECS SG
            VpcId: !Ref VpcId
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 5000
                ToPort: 5000
                SourceSecurityGroupId: !Ref ALBSG

        AllowEcsToRds:
          Type: AWS::EC2::SecurityGroupIngress
          Properties:
            GroupId: !Ref ExistingRDSSG
            IpProtocol: tcp
            FromPort: 3306
            ToPort: 3306
            SourceSecurityGroupId: !Ref BackendSG

        Cluster:
          Type: AWS::ECS::Cluster

        ExecutionRole:
          Type: AWS::IAM::Role
          Properties:
            AssumeRolePolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ecs-tasks.amazonaws.com
                  Action: sts:AssumeRole
            ManagedPolicyArns:
              - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

        TaskDef:
          Type: AWS::ECS::TaskDefinition
          Properties:
            Cpu: 256
            Memory: 512
            NetworkMode: awsvpc
            RequiresCompatibilities: [FARGATE]
            ExecutionRoleArn: !GetAtt ExecutionRole.Arn
            ContainerDefinitions:
              - Name: backend
                Image: !Ref ImageURI
                PortMappings:
                  - ContainerPort: 5000
                Environment:
                  - Name: DB_HOST
                    Value: !Ref DBHost
                  - Name: DB_USER
                    Value: !Ref DBUser
                  - Name: DB_PASSWORD
                    Value: !Ref DBPassword
                  - Name: DB_NAME
                    Value: !Ref DBName
                LogConfiguration:
                  LogDriver: awslogs
                  Options:
                    awslogs-group: /ecs/backend
                    awslogs-region: us-east-1
                    awslogs-stream-prefix: ecs

        TG:
          Type: AWS::ElasticLoadBalancingV2::TargetGroup
          Properties:
            VpcId: !Ref VpcId
            Port: 5000
            Protocol: HTTP
            TargetType: ip
            HealthCheckPath: /health

        ALB:
          Type: AWS::ElasticLoadBalancingV2::LoadBalancer
          Properties:
            Scheme: internet-facing
            Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
            SecurityGroups: [!Ref ALBSG]

        Listener:
          Type: AWS::ElasticLoadBalancingV2::Listener
          Properties:
            LoadBalancerArn: !Ref ALB
            Port: 80
            Protocol: HTTP
            DefaultActions:
              - Type: forward
                TargetGroupArn: !Ref TG

        Service:
          Type: AWS::ECS::Service
          DependsOn: Listener
          Properties:
            Cluster: !Ref Cluster
            LaunchType: FARGATE
            DesiredCount: 1
            TaskDefinition: !Ref TaskDef
            NetworkConfiguration:
              AwsvpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
                SecurityGroups: [!Ref BackendSG]
            LoadBalancers:
              - ContainerName: backend
                ContainerPort: 5000
                TargetGroupArn: !Ref TG

      Outputs:
        BackendURL:
          Value: !GetAtt ALB.DNSName
      EOF

    - |
      aws cloudformation deploy \
        --stack-name "$STACK_NAME" \
        --template-file backend.yaml \
        --capabilities CAPABILITY_NAMED_IAM \
        --parameter-overrides \
        ImageURI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG" \
        DBHost="database-1-use1.cujgu046ilz9.us-east-1.rds.amazonaws.com" \
        DBUser="$DB_USER" \
        DBPassword="$DB_PASSWORD" \
        DBName="ecommerce_db" \
        VpcId="vpc-0c94c781bb54a1008" \
        PublicSubnetA="subnet-0951f168b0769217c" \
        PublicSubnetB="subnet-0a61c37122c11d0f1" \
        ExistingRDSSG="sg-0f5f53246f5b20572"
  only:
    - main
