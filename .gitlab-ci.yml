image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  STACK_NAME: backend-stack

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - aws sts get-caller-identity
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

# ================= BUILD =================
build-backend:
  stage: build
  script:
    - aws ecr describe-repositories --repository-names "$BACKEND_REPO" || aws ecr create-repository --repository-name "$BACKEND_REPO"
    - aws ecr get-login-password | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
  only: [main]

# ================= DEPLOY =================
deploy-backend:
  stage: deploy
  needs: ["build-backend"]
  script:
    - |
      cat > backend.yaml << 'EOF'
      AWSTemplateFormatVersion: "2010-09-09"
      Description: ECS Backend + RDS (NO NAT, NO PRIVATE SUBNET)

      Parameters:
        ImageURI:
          Type: String
        DBUser:
          Type: String
          Default: admin
        DBPassword:
          Type: String
          NoEcho: true
          Default: StrongPass123!

      Resources:
        VPC:
          Type: AWS::EC2::VPC
          Properties:
            CidrBlock: 10.20.0.0/16
            EnableDnsSupport: true
            EnableDnsHostnames: true

        IGW:
          Type: AWS::EC2::InternetGateway

        AttachIGW:
          Type: AWS::EC2::VPCGatewayAttachment
          Properties:
            VpcId: !Ref VPC
            InternetGatewayId: !Ref IGW

        SubnetA:
          Type: AWS::EC2::Subnet
          Properties:
            VpcId: !Ref VPC
            CidrBlock: 10.20.1.0/24
            AvailabilityZone: us-east-1a
            MapPublicIpOnLaunch: true

        SubnetB:
          Type: AWS::EC2::Subnet
          Properties:
            VpcId: !Ref VPC
            CidrBlock: 10.20.2.0/24
            AvailabilityZone: us-east-1b
            MapPublicIpOnLaunch: true

        RouteTable:
          Type: AWS::EC2::RouteTable
          Properties:
            VpcId: !Ref VPC

        Route:
          Type: AWS::EC2::Route
          DependsOn: AttachIGW
          Properties:
            RouteTableId: !Ref RouteTable
            DestinationCidrBlock: 0.0.0.0/0
            GatewayId: !Ref IGW

        SubnetARoute:
          Type: AWS::EC2::SubnetRouteTableAssociation
          Properties:
            SubnetId: !Ref SubnetA
            RouteTableId: !Ref RouteTable

        SubnetBRoute:
          Type: AWS::EC2::SubnetRouteTableAssociation
          Properties:
            SubnetId: !Ref SubnetB
            RouteTableId: !Ref RouteTable

        ALBSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: ALB SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 80
                ToPort: 80
                CidrIp: 0.0.0.0/0

        BackendSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: Backend ECS SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 5000
                ToPort: 5000
                SourceSecurityGroupId: !Ref ALBSG

        RDSSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: RDS SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 3306
                ToPort: 3306
                SourceSecurityGroupId: !Ref BackendSG

        DB:
          Type: AWS::RDS::DBInstance
          Properties:
            Engine: mysql
            DBInstanceClass: db.t3.micro
            AllocatedStorage: 20
            MasterUsername: !Ref DBUser
            MasterUserPassword: !Ref DBPassword
            VPCSecurityGroups: [!Ref RDSSG]
            PubliclyAccessible: true
            BackupRetentionPeriod: 0

        Cluster:
          Type: AWS::ECS::Cluster

        ExecutionRole:
          Type: AWS::IAM::Role
          Properties:
            AssumeRolePolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ecs-tasks.amazonaws.com
                  Action: sts:AssumeRole
            ManagedPolicyArns:
              - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

        TaskDef:
          Type: AWS::ECS::TaskDefinition
          Properties:
            Cpu: 256
            Memory: 512
            NetworkMode: awsvpc
            RequiresCompatibilities: [FARGATE]
            ExecutionRoleArn: !GetAtt ExecutionRole.Arn
            ContainerDefinitions:
              - Name: backend
                Image: !Ref ImageURI
                PortMappings:
                  - ContainerPort: 5000
                Environment:
                  - Name: DB_HOST
                    Value: !GetAtt DB.Endpoint.Address
                  - Name: DB_USER
                    Value: !Ref DBUser
                  - Name: DB_PASSWORD
                    Value: !Ref DBPassword

        TG:
          Type: AWS::ElasticLoadBalancingV2::TargetGroup
          Properties:
            VpcId: !Ref VPC
            Port: 5000
            Protocol: HTTP
            TargetType: ip
            HealthCheckPath: /health

        ALB:
          Type: AWS::ElasticLoadBalancingV2::LoadBalancer
          Properties:
            Scheme: internet-facing
            Subnets: [!Ref SubnetA, !Ref SubnetB]
            SecurityGroups: [!Ref ALBSG]

        Listener:
          Type: AWS::ElasticLoadBalancingV2::Listener
          Properties:
            LoadBalancerArn: !Ref ALB
            Port: 80
            Protocol: HTTP
            DefaultActions:
              - Type: forward
                TargetGroupArn: !Ref TG

        Service:
          Type: AWS::ECS::Service
          DependsOn: Listener
          Properties:
            Cluster: !Ref Cluster
            LaunchType: FARGATE
            DesiredCount: 1
            TaskDefinition: !Ref TaskDef
            NetworkConfiguration:
              AwsvpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets: [!Ref SubnetA, !Ref SubnetB]
                SecurityGroups: [!Ref BackendSG]
            LoadBalancers:
              - ContainerName: backend
                ContainerPort: 5000
                TargetGroupArn: !Ref TG

      Outputs:
        BackendURL:
          Value: !GetAtt ALB.DNSName
      EOF

    - |
      aws cloudformation deploy \
        --stack-name "$STACK_NAME" \
        --template-file backend.yaml \
        --capabilities CAPABILITY_NAMED_IAM \
        --parameter-overrides ImageURI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
  only: [main]
