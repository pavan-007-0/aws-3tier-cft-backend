image: docker:24
services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  CLUSTER_NAME: ecommerce-cluster

stages:
  - build
  - infra
  - deploy

build-backend:
  stage: build
  before_script:
    - apk add --no-cache aws-cli
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - aws ecr describe-repositories --repository-names "$BACKEND_REPO" || aws ecr create-repository --repository-name "$BACKEND_REPO"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
  only:
    - main

provision-eks:
  stage: infra
  needs: ["build-backend"]
  image: alpine:3.18
  before_script:
    - apk add --no-cache aws-cli curl bash openssl jq
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - curl -sL "https://github.com/weaveworks/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz" | tar xz -C /usr/local/bin
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" && chmod +x kubectl && mv kubectl /usr/local/bin/
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script:
    # 1. Fix IAM permissions (✅ ALREADY WORKING)
    - |
      echo "🔧 Fixing NodeGroup IAM..."
      NODE_ROLE=$(aws iam list-roles --query 'Roles[?contains(RoleName,`ecommerce-cluster-nodegroup`)]|[0].RoleName' --output text 2>/dev/null || echo "none")
      if [ "$NODE_ROLE" != "none" ]; then
        aws iam attach-role-policy --role-name "$NODE_ROLE" --policy-arn arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess || true
        echo "✅ ELB permissions added: $NODE_ROLE"
      fi

    # 2. Update kubeconfig
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"

    # 3. Install/upgrade ALB Controller (✅ WORKING)
    - |
      echo "📦 Installing AWS Load Balancer Controller..."
      helm repo add eks https://aws.github.io/eks-charts || true
      helm repo update
      helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
        -n kube-system --create-namespace \
        --set clusterName=$CLUSTER_NAME \
        --set serviceAccount.create=true \
        --set region=$AWS_DEFAULT_REGION \
        --set vpcId=vpc-0c94c781bb54a1008 \
        --wait --timeout=5m
      kubectl rollout status deployment/aws-load-balancer-controller -n kube-system --timeout=120s

    # 4. Install External Secrets WITH PROPER CRD WAITING (🔧 FIXED)
    - |
      echo "🔑 Installing External Secrets..."
      helm repo add external-secrets https://charts.external-secrets.io || true
      helm repo update
      helm upgrade --install external-secrets external-secrets/external-secrets \
        -n external-secrets --create-namespace --wait --timeout=5m \
        --set installCRDs=true \
        --set serviceAccount.create=true

      # Wait for External Secrets deployment to be ready
      kubectl wait --for=condition=Available deployment/external-secrets -n external-secrets --timeout=120s
      sleep 15  # Extra buffer for CRDs

      # Verify CRDs are ready
      until kubectl get crd clustersecretstores.external-secrets.io &>/dev/null; do
        echo "⏳ Waiting for External Secrets CRDs..."
        sleep 5
      done
      echo "✅ External Secrets CRDs ready!"

    # 5. Create secrets configuration
    - |
      cat << EOF | kubectl apply -f -
      apiVersion: external-secrets.io/v1beta1
      kind: ClusterSecretStore
      metadata:
        name: aws-secrets-manager
      spec:
        provider:
          aws:
            service: SecretsManager
            region: us-east-1
            auth:
              jwt:
                serviceAccountRef:
                  name: external-secrets-sa
                  namespace: external-secrets
      ---
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: backend-secrets
        namespace: default
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: aws-secrets-manager
          kind: ClusterSecretStore
        target:
          name: backend-secrets
          create: true
        data:
        - secretKey: DB_USER
          remoteRef:
            key: "rds!db-bc9e1596-3d78-4991-8bd9-58e17d3073c1"
            property: username
        - secretKey: DB_PASSWORD
          remoteRef:
            key: "rds!db-bc9e1596-3d78-4991-8bd9-58e17d3073c1"
            property: password
        - secretKey: JWT_SECRET_KEY
          remoteRef:
            key: "app/backend/secrets"
            property: JWT_SECRET_KEY
        - secretKey: SECRET_KEY
          remoteRef:
            key: "app/backend/secrets"
            property: SECRET_KEY
      EOF
      echo "✅ Secrets configured successfully!"

  only:
    - main

deploy-backend:
  stage: deploy
  needs: ["provision-eks"]
  image: alpine:3.18
  before_script:
    - apk add --no-cache aws-cli curl bash jq gettext
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"
  script:
    # Deploy complete backend stack
    - |
      cat > backend-manifests.yaml << EOF
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: default
      spec:
        replicas: 2
        selector:
          matchLabels:
            app: backend
        template:
          metadata:
            labels:
              app: backend
          spec:
            containers:
            - name: backend
              image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${BACKEND_REPO}:${IMAGE_TAG}
              ports:
              - containerPort: 5000
              env:
              - name: DB_HOST
                value: "database-1.cujgu046ilz9.us-east-1.rds.amazonaws.com"
              - name: DB_NAME
                value: "ecommerce_db"
              - name: FLASK_ENV
                value: "production"
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_USER
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_PASSWORD
              - name: JWT_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: JWT_SECRET_KEY
              - name: SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: SECRET_KEY
              resources:
                requests:
                  cpu: "125m"
                  memory: "256Mi"
                limits:
                  cpu: "250m"
                  memory: "512Mi"
              livenessProbe:
                httpGet:
                  path: /health
                  port: 5000
                initialDelaySeconds: 30
                periodSeconds: 30
              readinessProbe:
                httpGet:
                  path: /health
                  port: 5000
                initialDelaySeconds: 20
                periodSeconds: 20
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        namespace: default
      spec:
        type: ClusterIP
        selector:
          app: backend
        ports:
        - port: 5000
          targetPort: 5000
          protocol: TCP
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: backend
        namespace: default
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/healthcheck-path: /health
          alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
          alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
          alb.ingress.kubernetes.io/healthy-threshold-count: "3"
          alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      spec:
        rules:
        - http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: backend
                  port:
                    number: 5000
      EOF

    # Apply manifests
    - kubectl apply -f backend-manifests.yaml
    - kubectl rollout status deployment/backend -n default --timeout=300s
    - echo "✅ Backend deployment successful!"

    # Wait for ALB provisioning and test
    - |
      echo "⏳ Waiting for ALB Load Balancer (5 minutes max)..."
      for i in {1..300}; do
        BACKEND_URL=$(kubectl get ingress backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
        if [ -n "$BACKEND_URL" ]; then
          echo "🎉 BACKEND LIVE AT: http://$BACKEND_URL"
          echo "🩺 Testing health endpoint..."
          if curl -f -m 10 "http://$BACKEND_URL/health"; then
            echo "✅ HEALTH CHECK PASSED!"
          else
            echo "⚠️ Health check failed - check pod logs"
          fi
          kubectl get ingress backend -n default -o wide
          break
        fi
        echo "⏳ ALB provisioning... ($i/300)"
        sleep 1
      done

    - echo "🚀 E-COMMERCE BACKEND FULLY DEPLOYED TO PRODUCTION!"
    - kubectl get all -n default
    - kubectl get ingress -n default

  only:
    - main
