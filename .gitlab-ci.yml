image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  BACKEND_STACK: backend-stack

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - aws sts get-caller-identity
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

# ================= BUILD & PUSH IMAGE =================
build-backend:
  stage: build
  script:
    - |
      aws ecr describe-repositories \
        --repository-names "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION" \
      || aws ecr create-repository \
        --repository-name "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION"

    - |
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | \
      docker login --username AWS --password-stdin \
      "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"

    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"

  only:
    - main

# ================= DEPLOY ECS + ALB =================
deploy-backend:
  stage: deploy
  needs: ["build-backend"]
  script:
    - |
      cat > backend-infra.yaml << 'EOF'
      AWSTemplateFormatVersion: "2010-09-09"
      Description: Backend ECS Fargate with ALB

      Parameters:
        ImageURI:
          Type: String

      Resources:
        VPC:
          Type: AWS::EC2::VPC
          Properties:
            CidrBlock: 10.50.0.0/16
            EnableDnsSupport: true
            EnableDnsHostnames: true

        InternetGateway:
          Type: AWS::EC2::InternetGateway

        AttachIGW:
          Type: AWS::EC2::VPCGatewayAttachment
          Properties:
            VpcId: !Ref VPC
            InternetGatewayId: !Ref InternetGateway

        PublicSubnetA:
          Type: AWS::EC2::Subnet
          Properties:
            VpcId: !Ref VPC
            CidrBlock: 10.50.1.0/24
            AvailabilityZone: us-east-1a
            MapPublicIpOnLaunch: true

        PublicSubnetB:
          Type: AWS::EC2::Subnet
          Properties:
            VpcId: !Ref VPC
            CidrBlock: 10.50.2.0/24
            AvailabilityZone: us-east-1b
            MapPublicIpOnLaunch: true

        RouteTable:
          Type: AWS::EC2::RouteTable
          Properties:
            VpcId: !Ref VPC

        DefaultRoute:
          Type: AWS::EC2::Route
          DependsOn: AttachIGW
          Properties:
            RouteTableId: !Ref RouteTable
            DestinationCidrBlock: 0.0.0.0/0
            GatewayId: !Ref InternetGateway

        SubnetARoute:
          Type: AWS::EC2::SubnetRouteTableAssociation
          Properties:
            SubnetId: !Ref PublicSubnetA
            RouteTableId: !Ref RouteTable

        SubnetBRoute:
          Type: AWS::EC2::SubnetRouteTableAssociation
          Properties:
            SubnetId: !Ref PublicSubnetB
            RouteTableId: !Ref RouteTable

        ALBSecurityGroup:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: ALB SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 80
                ToPort: 80
                CidrIp: 0.0.0.0/0

        ECSTaskSecurityGroup:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: ECS Task SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 5000
                ToPort: 5000
                SourceSecurityGroupId: !Ref ALBSecurityGroup

        ECSCluster:
          Type: AWS::ECS::Cluster

        TaskExecutionRole:
          Type: AWS::IAM::Role
          Properties:
            AssumeRolePolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ecs-tasks.amazonaws.com
                  Action: sts:AssumeRole
            ManagedPolicyArns:
              - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
              - arn:aws:iam::aws:policy/SecretsManagerReadWrite

        TaskDefinition:
          Type: AWS::ECS::TaskDefinition
          Properties:
            Cpu: "256"
            Memory: "512"
            NetworkMode: awsvpc
            RequiresCompatibilities: [FARGATE]
            ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
            ContainerDefinitions:
              - Name: backend
                Image: !Ref ImageURI
                PortMappings:
                  - ContainerPort: 5000
                Environment:
                  - Name: DB_HOST
                    Value: database-1-use1.c7k0u8mcq7i1.us-east-1.rds.amazonaws.com
                  - Name: DB_USER
                    Value: admin
                  - Name: DB_NAME
                    Value: ecommerce_db
                Secrets:
                  - Name: DB_PASSWORD
                    ValueFrom: arn:aws:secretsmanager:us-east-1:088042034531:secret:rds!db-06783279-a268-42c4-884b-7f7475c0ad62:password::

        TargetGroup:
          Type: AWS::ElasticLoadBalancingV2::TargetGroup
          Properties:
            VpcId: !Ref VPC
            Port: 5000
            Protocol: HTTP
            TargetType: ip
            HealthCheckPath: /health

        LoadBalancer:
          Type: AWS::ElasticLoadBalancingV2::LoadBalancer
          Properties:
            Scheme: internet-facing
            Subnets:
              - !Ref PublicSubnetA
              - !Ref PublicSubnetB
            SecurityGroups:
              - !Ref ALBSecurityGroup

        Listener:
          Type: AWS::ElasticLoadBalancingV2::Listener
          Properties:
            LoadBalancerArn: !Ref LoadBalancer
            Port: 80
            Protocol: HTTP
            DefaultActions:
              - Type: forward
                TargetGroupArn: !Ref TargetGroup

        ECSService:
          Type: AWS::ECS::Service
          DependsOn: Listener
          Properties:
            Cluster: !Ref ECSCluster
            LaunchType: FARGATE
            DesiredCount: 1
            TaskDefinition: !Ref TaskDefinition
            NetworkConfiguration:
              AwsvpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets:
                  - !Ref PublicSubnetA
                  - !Ref PublicSubnetB
                SecurityGroups:
                  - !Ref ECSTaskSecurityGroup
            LoadBalancers:
              - ContainerName: backend
                ContainerPort: 5000
                TargetGroupArn: !Ref TargetGroup

      Outputs:
        BackendURL:
          Value: !GetAtt LoadBalancer.DNSName
      EOF

    - |
      aws cloudformation deploy \
        --stack-name "$BACKEND_STACK" \
        --template-file backend-infra.yaml \
        --capabilities CAPABILITY_NAMED_IAM \
        --parameter-overrides \
          ImageURI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"

  only:
    - main
