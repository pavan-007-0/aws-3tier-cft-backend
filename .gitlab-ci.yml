stages:
  - validate
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  CLUSTER_NAME: ecommerce-cluster
  VPC_ID: "vpc-0c94c781bb54a1008"
  SUBNET_A: "subnet-0951f168b0769217c"
  SUBNET_B: "subnet-0a61c37122c11d0f1"
  RDS_SG_ID: "sg-0f5f53246f5b20572"

# ================================================
# STAGE 1 — VALIDATE
# ================================================

validate-yaml:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y python3-pip
    - pip3 install yamllint
  script:
    - echo "🔍 Linting .gitlab-ci.yml..."
    - yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" .gitlab-ci.yml
    - echo "✅ YAML syntax is valid"
  only:
    - main

validate-infra:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - echo "🔍 Validating AWS credentials..."
    - aws sts get-caller-identity
    - echo "✅ AWS credentials valid"

    - echo "🔍 Checking EKS cluster exists..."
    - aws eks describe-cluster --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION" --query "cluster.status" --output text
    - echo "✅ EKS cluster found"

    - echo "🔍 Checking ECR repo exists or can be created..."
    - aws ecr describe-repositories --repository-names "$BACKEND_REPO" || echo "ℹ️ Repo will be created during build"

    - echo "🔍 Checking RDS security group exists..."
    - aws ec2 describe-security-groups --group-ids "$RDS_SG_ID" --query "SecurityGroups[0].GroupId" --output text
    - echo "✅ RDS security group found"

    - echo "🔍 Checking subnets exist..."
    - aws ec2 describe-subnets --subnet-ids "$SUBNET_A" "$SUBNET_B" --query "Subnets[*].SubnetId" --output text
    - echo "✅ Subnets found"

    - echo "🔍 Checking Secrets Manager secrets exist..."
    - aws secretsmanager describe-secret --secret-id "secrets/backend/app" --query "Name" --output text
    - echo "✅ Secrets found"
  only:
    - main

validate-docker:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y python3-pip
    - pip3 install dockerfile-parse
  script:
    - echo "🔍 Checking Dockerfile exists..."
    - test -f Dockerfile || (echo "❌ Dockerfile not found!" && exit 1)
    - echo "✅ Dockerfile found"

    - echo "🔍 Validating Dockerfile syntax..."
    - |
      python3 << 'PYEOF'
      from dockerfile_parse import DockerfileParser
      try:
          dfp = DockerfileParser(path='.')
          print(f"Base image: {dfp.baseimage}")
          print(f"Instructions: {len(dfp.structure)}")
          print("✅ Dockerfile syntax valid")
      except Exception as e:
          print(f"❌ Dockerfile parse error: {e}")
          exit(1)
      PYEOF

    - echo "🔍 Checking required files exist..."
    - test -f requirements.txt || (echo "❌ requirements.txt not found!" && exit 1)
    - echo "✅ requirements.txt found"
  only:
    - main

validate-k8s-manifests:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y tar gzip
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - echo "🔍 Generating and dry-run validating Kubernetes manifests..."
    - |
      FRONTEND_URL="http://placeholder-for-validation.example.com"
      cat > backend-manifests-validate.yaml << EOF
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: backend-secrets
        namespace: default
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: aws-secrets-manager
          kind: ClusterSecretStore
        target:
          name: backend-secrets
          creationPolicy: Owner
        data:
        - secretKey: DB_USER
          remoteRef:
            key: "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab"
            property: username
        - secretKey: DB_PASSWORD
          remoteRef:
            key: "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab"
            property: password
        - secretKey: JWT_SECRET_KEY
          remoteRef:
            key: "secrets/backend/app"
            property: JWT_SECRET_KEY
        - secretKey: SECRET_KEY
          remoteRef:
            key: "secrets/backend/app"
            property: SECRET_KEY
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: default
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: backend
        template:
          metadata:
            labels:
              app: backend
          spec:
            containers:
            - name: backend
              image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${BACKEND_REPO}:${IMAGE_TAG}
              ports:
              - containerPort: 5000
              env:
              - name: DB_HOST
                value: "database-1.coxucmkk0rho.us-east-1.rds.amazonaws.com"
              - name: DB_NAME
                value: "ecommerce_db"
              - name: FLASK_ENV
                value: "production"
              - name: CORS_ORIGINS
                value: "${FRONTEND_URL}"
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_USER
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_PASSWORD
              - name: JWT_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: JWT_SECRET_KEY
              - name: SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: SECRET_KEY
              resources:
                requests:
                  cpu: "256m"
                  memory: "512Mi"
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        namespace: default
      spec:
        type: ClusterIP
        selector:
          app: backend
        ports:
        - port: 5000
          targetPort: 5000
          protocol: TCP
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: backend
        namespace: default
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/subnets: ${SUBNET_A}, ${SUBNET_B}
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
          alb.ingress.kubernetes.io/healthcheck-path: /health
      spec:
        rules:
        - http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: backend
                  port:
                    number: 5000
      EOF

    - echo "🔍 Running kubectl dry-run validation..."
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"
    # dry-run ExternalSecret separately (CRD — server won't know it, client-side only)
    - kubectl apply --dry-run=client -f backend-manifests-validate.yaml 2>&1 | grep -v "unknown field" || true
    - echo "✅ Kubernetes manifests are valid"
  only:
    - main

# ================================================
# STAGE 2 — BUILD
# ================================================

build-backend:
  stage: build
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - yum install -y docker
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - aws ecr describe-repositories --repository-names "$BACKEND_REPO" || aws ecr create-repository --repository-name "$BACKEND_REPO"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - echo "✅ Image pushed to ECR successfully"
  only:
    - main

# ================================================
# STAGE 3 — DEPLOY
# ================================================

deploy-backend:
  stage: deploy
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  needs: ["build-backend"]
  before_script:
    - yum install -y tar gzip gettext jq
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"
  script:
    # 1. Allow EKS Nodes to access RDS
    - |
      echo "🔐 Authorizing EKS nodes to access RDS Database..."
      EKS_NODE_SG=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query "cluster.resourcesVpcConfig.clusterSecurityGroupId" --output text)

      RULE_EXISTS=$(aws ec2 describe-security-group-rules \
        --filters \
          Name="group-id",Values="$RDS_SG_ID" \
          Name="ip-permission.to-port",Values="3306" \
          Name="ip-permission.from-port",Values="3306" \
          Name="ip-permission.protocol",Values="tcp" \
          Name="ip-permission.user-id-group-pairs.group-id",Values="$EKS_NODE_SG" \
        --query "SecurityGroupRules" --output text)

      if [ -z "$RULE_EXISTS" ]; then
        aws ec2 authorize-security-group-ingress \
          --group-id "$RDS_SG_ID" \
          --protocol tcp \
          --port 3306 \
          --source-group "$EKS_NODE_SG" || true
        echo "✅ Access granted from EKS ($EKS_NODE_SG) to RDS ($RDS_SG_ID)"
      else
        echo "✅ EKS to RDS security group rule already exists."
      fi

    # 2. Fetch Frontend URL for CORS
    - |
      FRONTEND_URL=$(aws cloudformation describe-stacks \
        --stack-name frontend-stack \
        --query "Stacks[0].Outputs[?OutputKey=='FrontendURL'].OutputValue" \
        --output text || echo "http://localhost:4200")
      echo "Detected Frontend URL: $FRONTEND_URL"

    # 3. Generate and Apply Kubernetes Manifests
    - |
      echo "📦 Deploying Kubernetes Manifests..."
      cat > backend-manifests.yaml << EOF
      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: backend-secrets
        namespace: default
      spec:
        refreshInterval: 1h
        secretStoreRef:
          name: aws-secrets-manager
          kind: ClusterSecretStore
        target:
          name: backend-secrets
          creationPolicy: Owner
        data:
        - secretKey: DB_USER
          remoteRef:
            key: "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab"
            property: username
        - secretKey: DB_PASSWORD
          remoteRef:
            key: "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab"
            property: password
        - secretKey: JWT_SECRET_KEY
          remoteRef:
            key: "secrets/backend/app"
            property: JWT_SECRET_KEY
        - secretKey: SECRET_KEY
          remoteRef:
            key: "secrets/backend/app"
            property: SECRET_KEY
      ---
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: default
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: backend
        template:
          metadata:
            labels:
              app: backend
          spec:
            containers:
            - name: backend
              image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${BACKEND_REPO}:${IMAGE_TAG}
              ports:
              - containerPort: 5000
              env:
              - name: DB_HOST
                value: "database-1.coxucmkk0rho.us-east-1.rds.amazonaws.com"
              - name: DB_NAME
                value: "ecommerce_db"
              - name: FLASK_ENV
                value: "production"
              - name: CORS_ORIGINS
                value: "${FRONTEND_URL}"
              - name: DB_USER
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_USER
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: DB_PASSWORD
              - name: JWT_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: JWT_SECRET_KEY
              - name: SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: backend-secrets
                    key: SECRET_KEY
              resources:
                requests:
                  cpu: "256m"
                  memory: "512Mi"
      ---
      apiVersion: v1
      kind: Service
      metadata:
        name: backend
        namespace: default
      spec:
        type: ClusterIP
        selector:
          app: backend
        ports:
        - port: 5000
          targetPort: 5000
          protocol: TCP
      ---
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: backend
        namespace: default
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/subnets: ${SUBNET_A}, ${SUBNET_B}
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
          alb.ingress.kubernetes.io/healthcheck-path: /health
      spec:
        rules:
        - http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: backend
                  port:
                    number: 5000
      EOF

      kubectl apply -f backend-manifests.yaml
      kubectl rollout status deployment/backend -n default --timeout=300s
      echo "✅ Backend successfully deployed to EKS!"

    # 4. Wait for ALB URL
    - |
      echo "⏳ Waiting for ALB Load Balancer to provision..."
      for i in {1..120}; do
        BACKEND_URL=$(kubectl get ingress backend -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -n "$BACKEND_URL" ]; then
          echo "🎉 BACKEND LIVE AT: http://$BACKEND_URL"
          break
        fi
        sleep 5
      done
  only:
    - main