image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  BACKEND_STACK_NAME: backend-stack

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - aws sts get-caller-identity
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  - echo "AWS Account: $AWS_ACCOUNT_ID"
  - echo "Region: $AWS_DEFAULT_REGION"

build-backend:
  stage: build
  script:
    - |
      aws ecr describe-repositories \
        --repository-names $BACKEND_REPO \
        --region $AWS_DEFAULT_REGION \
      || aws ecr create-repository \
        --repository-name $BACKEND_REPO \
        --region $AWS_DEFAULT_REGION

    - |
      aws ecr get-login-password --region $AWS_DEFAULT_REGION \
      | docker login \
        --username AWS \
        --password-stdin \
        $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

    - docker build -t $BACKEND_REPO:$IMAGE_TAG .
    - docker tag $BACKEND_REPO:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG
  only:
    - main

deploy-backend:
  stage: deploy
  script:
    - |
      aws cloudformation deploy \
        --stack-name $BACKEND_STACK_NAME \
        --template-file backend-template.yaml \
        --capabilities CAPABILITY_NAMED_IAM \
        --parameter-overrides \
          BackendImageURI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG \
        --no-fail-on-empty-changeset

    - |
      aws cloudformation describe-stacks \
        --stack-name $BACKEND_STACK_NAME \
        --query "Stacks[0].Outputs" \
        --output table
  needs:
    - build-backend
  only:
    - main
