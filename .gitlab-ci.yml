stages:
  - validate
  - infra-network
  - infra-cluster
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  CLUSTER_NAME: ecommerce-cluster
  VPC_CIDR: "10.0.0.0/16"
  SUBNET_A_CIDR: "10.0.1.0/24"
  SUBNET_B_CIDR: "10.0.2.0/24"
  RDS_ENDPOINT: "database-1.coxucmkk0rho.us-east-1.rds.amazonaws.com"
  NODE_INSTANCE_TYPE: "t3.medium"
  NODE_MIN: "1"
  NODE_MAX: "3"
  NODE_DESIRED: "2"

# ==========================
# STAGE 1 - VALIDATE
# ==========================

validate-aws-credentials:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - echo "Validating AWS credentials..."
    - aws sts get-caller-identity
    - echo "Checking region is reachable..."
    - aws ec2 describe-availability-zones --region "$AWS_DEFAULT_REGION" --query "AvailabilityZones[0].State" --output text
    - echo "Verifying Secrets Manager secrets exist..."
    - aws secretsmanager describe-secret --secret-id "secrets/backend/app" --query "Name" --output text
    - aws secretsmanager describe-secret --secret-id "rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab" --query "Name" --output text
    - echo "All AWS credential checks passed"
  only:
    - main

validate-python-code:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y python3-pip
    - pip3 install pyflakes bandit flask flask-cors flask-limiter flask-wtf mysql-connector-python python-dotenv PyJWT Werkzeug cryptography bcrypt marshmallow email-validator requests gunicorn
  script:
    - echo "Checking Python syntax on all .py files..."
    - |
      SYNTAX_ERRORS=0
      for f in $(find . -name "*.py" -not -path "./__pycache__/*"); do
        python3 -m py_compile "$f" 2>&1
        if [ $? -ne 0 ]; then
          echo "SYNTAX ERROR in $f"
          SYNTAX_ERRORS=$((SYNTAX_ERRORS + 1))
        else
          echo "OK: $f"
        fi
      done
      if [ $SYNTAX_ERRORS -gt 0 ]; then
        echo "$SYNTAX_ERRORS file(s) have syntax errors. Fix before pushing."
        exit 1
      fi
      echo "All Python files passed syntax check"
    - echo "Running pyflakes..."
    - python3 -m pyflakes app.py auth.py db.py orders.py products.py cart.py admin.py security.py error_handlers.py 2>&1 || true
    - echo "Running bandit on core app files only..."
    - python3 -m bandit -r app.py auth.py db.py orders.py products.py cart.py admin.py security.py error_handlers.py --severity-level high -f txt 2>&1 || true
    - echo "Python validation complete"
  only:
    - main

validate-docker:
  stage: validate
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y python3-pip
    - pip3 install dockerfile-parse
  script:
    - echo "Checking Dockerfile exists..."
    - test -f Dockerfile || (echo "ERROR Dockerfile not found" && exit 1)
    - |
      python3 -c "
      from dockerfile_parse import DockerfileParser
      try:
          dfp = DockerfileParser(path='.')
          print('Base image: ' + str(dfp.baseimage))
          print('Total instructions: ' + str(len(dfp.structure)))
          required = ['FROM', 'WORKDIR', 'COPY', 'RUN', 'CMD']
          found = [s['instruction'] for s in dfp.structure]
          for r in required:
              if r in found:
                  print('OK: ' + r + ' instruction found')
              else:
                  print('WARNING: ' + r + ' instruction not found')
          print('Dockerfile validation passed')
      except Exception as e:
          print('ERROR: ' + str(e))
          exit(1)
      "
    - echo "Checking requirements.txt exists and is not empty..."
    - test -f requirements.txt || (echo "ERROR requirements.txt not found" && exit 1)
    - test -s requirements.txt || (echo "ERROR requirements.txt is empty" && exit 1)
    - echo "Docker validation passed"
  only:
    - main

# ==========================
# STAGE 2 - INFRA NETWORK
# public subnets only
# NO NAT gateway
# NO elastic IPs
# ==========================

infra-network:
  stage: infra-network
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - echo "Checking for any existing NAT gateways to avoid accidental creation..."
    - |
      EXISTING_NAT=$(aws ec2 describe-nat-gateways \
        --filter "Name=state,Values=available,pending" \
        --query "NatGateways[?Tags[?Key=='Name' && contains(Value,'ecommerce')]].NatGatewayId" \
        --output text 2>/dev/null || echo "")
      if [ -n "$EXISTING_NAT" ]; then
        echo "WARNING: Found existing NAT gateway $EXISTING_NAT - pipeline will NOT create any new ones"
      else
        echo "No existing NAT gateways found - good, none will be created"
      fi

    - echo "Creating VPC if not exists..."
    - |
      VPC_ID=$(aws ec2 describe-vpcs \
        --filters "Name=tag:Name,Values=ecommerce-vpc" \
        --query "Vpcs[0].VpcId" --output text 2>/dev/null)

      if [ "$VPC_ID" = "None" ] || [ -z "$VPC_ID" ]; then
        VPC_ID=$(aws ec2 create-vpc \
          --cidr-block "$VPC_CIDR" \
          --query "Vpc.VpcId" --output text)
        aws ec2 create-tags --resources "$VPC_ID" \
          --tags Key=Name,Value=ecommerce-vpc Key=ManagedBy,Value=gitlab-cicd
        aws ec2 modify-vpc-attribute --vpc-id "$VPC_ID" --enable-dns-support
        aws ec2 modify-vpc-attribute --vpc-id "$VPC_ID" --enable-dns-hostnames
        echo "VPC created: $VPC_ID"
      else
        echo "VPC already exists: $VPC_ID"
      fi
      echo "VPC_ID=$VPC_ID" >> /tmp/infra.env

    - echo "Creating Internet Gateway if not exists..."
    - |
      source /tmp/infra.env
      IGW_ID=$(aws ec2 describe-internet-gateways \
        --filters "Name=tag:Name,Values=ecommerce-igw" \
        --query "InternetGateways[0].InternetGatewayId" --output text 2>/dev/null)

      if [ "$IGW_ID" = "None" ] || [ -z "$IGW_ID" ]; then
        IGW_ID=$(aws ec2 create-internet-gateway \
          --query "InternetGateway.InternetGatewayId" --output text)
        aws ec2 create-tags --resources "$IGW_ID" \
          --tags Key=Name,Value=ecommerce-igw Key=ManagedBy,Value=gitlab-cicd
        aws ec2 attach-internet-gateway \
          --internet-gateway-id "$IGW_ID" --vpc-id "$VPC_ID"
        echo "Internet Gateway created and attached: $IGW_ID"
      else
        echo "Internet Gateway already exists: $IGW_ID"
      fi
      echo "IGW_ID=$IGW_ID" >> /tmp/infra.env

    - echo "Getting availability zones..."
    - |
      AZ_A=$(aws ec2 describe-availability-zones \
        --region "$AWS_DEFAULT_REGION" \
        --query "AvailabilityZones[0].ZoneName" --output text)
      AZ_B=$(aws ec2 describe-availability-zones \
        --region "$AWS_DEFAULT_REGION" \
        --query "AvailabilityZones[1].ZoneName" --output text)
      echo "AZ_A=$AZ_A" >> /tmp/infra.env
      echo "AZ_B=$AZ_B" >> /tmp/infra.env
      echo "Using AZs: $AZ_A and $AZ_B"

    - echo "Creating public subnet A if not exists..."
    - |
      source /tmp/infra.env
      SUBNET_A=$(aws ec2 describe-subnets \
        --filters "Name=tag:Name,Values=ecommerce-subnet-public-a" "Name=vpc-id,Values=$VPC_ID" \
        --query "Subnets[0].SubnetId" --output text 2>/dev/null)

      if [ "$SUBNET_A" = "None" ] || [ -z "$SUBNET_A" ]; then
        SUBNET_A=$(aws ec2 create-subnet \
          --vpc-id "$VPC_ID" \
          --cidr-block "$SUBNET_A_CIDR" \
          --availability-zone "$AZ_A" \
          --query "Subnet.SubnetId" --output text)
        aws ec2 create-tags --resources "$SUBNET_A" \
          --tags Key=Name,Value=ecommerce-subnet-public-a \
                 Key=ManagedBy,Value=gitlab-cicd \
                 Key=kubernetes.io/role/elb,Value=1 \
                 Key=kubernetes.io/cluster/${CLUSTER_NAME},Value=shared
        aws ec2 modify-subnet-attribute --subnet-id "$SUBNET_A" --map-public-ip-on-launch
        echo "Public Subnet A created: $SUBNET_A in $AZ_A"
      else
        echo "Public Subnet A already exists: $SUBNET_A"
      fi
      echo "SUBNET_A=$SUBNET_A" >> /tmp/infra.env

    - echo "Creating public subnet B if not exists..."
    - |
      source /tmp/infra.env
      SUBNET_B=$(aws ec2 describe-subnets \
        --filters "Name=tag:Name,Values=ecommerce-subnet-public-b" "Name=vpc-id,Values=$VPC_ID" \
        --query "Subnets[0].SubnetId" --output text 2>/dev/null)

      if [ "$SUBNET_B" = "None" ] || [ -z "$SUBNET_B" ]; then
        SUBNET_B=$(aws ec2 create-subnet \
          --vpc-id "$VPC_ID" \
          --cidr-block "$SUBNET_B_CIDR" \
          --availability-zone "$AZ_B" \
          --query "Subnet.SubnetId" --output text)
        aws ec2 create-tags --resources "$SUBNET_B" \
          --tags Key=Name,Value=ecommerce-subnet-public-b \
                 Key=ManagedBy,Value=gitlab-cicd \
                 Key=kubernetes.io/role/elb,Value=1 \
                 Key=kubernetes.io/cluster/${CLUSTER_NAME},Value=shared
        aws ec2 modify-subnet-attribute --subnet-id "$SUBNET_B" --map-public-ip-on-launch
        echo "Public Subnet B created: $SUBNET_B in $AZ_B"
      else
        echo "Public Subnet B already exists: $SUBNET_B"
      fi
      echo "SUBNET_B=$SUBNET_B" >> /tmp/infra.env

    - echo "Creating public route table and attaching to both subnets..."
    - |
      source /tmp/infra.env
      RT_ID=$(aws ec2 describe-route-tables \
        --filters "Name=tag:Name,Values=ecommerce-public-rt" "Name=vpc-id,Values=$VPC_ID" \
        --query "RouteTables[0].RouteTableId" --output text 2>/dev/null)

      if [ "$RT_ID" = "None" ] || [ -z "$RT_ID" ]; then
        RT_ID=$(aws ec2 create-route-table \
          --vpc-id "$VPC_ID" \
          --query "RouteTable.RouteTableId" --output text)
        aws ec2 create-tags --resources "$RT_ID" \
          --tags Key=Name,Value=ecommerce-public-rt Key=ManagedBy,Value=gitlab-cicd
        aws ec2 create-route \
          --route-table-id "$RT_ID" \
          --destination-cidr-block "0.0.0.0/0" \
          --gateway-id "$IGW_ID"
        aws ec2 associate-route-table --route-table-id "$RT_ID" --subnet-id "$SUBNET_A"
        aws ec2 associate-route-table --route-table-id "$RT_ID" --subnet-id "$SUBNET_B"
        echo "Public route table created: $RT_ID"
        echo "Route: 0.0.0.0/0 -> Internet Gateway (no NAT, no Elastic IP)"
      else
        echo "Route table already exists: $RT_ID"
      fi

    - echo "Creating RDS security group if not exists..."
    - |
      source /tmp/infra.env
      RDS_SG_ID=$(aws ec2 describe-security-groups \
        --filters "Name=tag:Name,Values=ecommerce-rds-sg" "Name=vpc-id,Values=$VPC_ID" \
        --query "SecurityGroups[0].GroupId" --output text 2>/dev/null)

      if [ "$RDS_SG_ID" = "None" ] || [ -z "$RDS_SG_ID" ]; then
        RDS_SG_ID=$(aws ec2 create-security-group \
          --group-name ecommerce-rds-sg \
          --description "RDS access from EKS - no public access" \
          --vpc-id "$VPC_ID" \
          --query "GroupId" --output text)
        aws ec2 create-tags --resources "$RDS_SG_ID" \
          --tags Key=Name,Value=ecommerce-rds-sg Key=ManagedBy,Value=gitlab-cicd
        echo "RDS security group created: $RDS_SG_ID"
      else
        echo "RDS security group already exists: $RDS_SG_ID"
      fi
      echo "RDS_SG_ID=$RDS_SG_ID" >> /tmp/infra.env

    - echo "Saving all IDs to SSM Parameter Store..."
    - |
      source /tmp/infra.env
      aws ssm put-parameter --name "/ecommerce/vpc-id"    --value "$VPC_ID"    --type String --overwrite
      aws ssm put-parameter --name "/ecommerce/subnet-a"  --value "$SUBNET_A"  --type String --overwrite
      aws ssm put-parameter --name "/ecommerce/subnet-b"  --value "$SUBNET_B"  --type String --overwrite
      aws ssm put-parameter --name "/ecommerce/rds-sg-id" --value "$RDS_SG_ID" --type String --overwrite
      echo "All parameters saved to SSM"
      echo "-----------------------------"
      echo "VPC:              $VPC_ID"
      echo "Public Subnet A:  $SUBNET_A ($AZ_A)"
      echo "Public Subnet B:  $SUBNET_B ($AZ_B)"
      echo "RDS SG:           $RDS_SG_ID"
      echo "NAT Gateway:      NONE - not created"
      echo "Elastic IPs:      NONE - not created"
      echo "-----------------------------"
  only:
    - main

infra-ecr:
  stage: infra-network
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - echo "Ensuring ECR repository exists..."
    - |
      aws ecr describe-repositories \
        --repository-names "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION" 2>/dev/null || \
      aws ecr create-repository \
        --repository-name "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION" \
        --image-scanning-configuration scanOnPush=true \
        --encryption-configuration encryptionType=AES256
    - echo "ECR repository ready"
  only:
    - main

infra-secrets:
  stage: infra-network
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  script:
    - echo "Ensuring app secrets exist in Secrets Manager..."
    - |
      aws secretsmanager describe-secret \
        --secret-id "secrets/backend/app" \
        --region "$AWS_DEFAULT_REGION" 2>/dev/null || \
      aws secretsmanager create-secret \
        --name "secrets/backend/app" \
        --description "Backend app secrets" \
        --secret-string '{"JWT_SECRET_KEY":"change-me-jwt-secret","SECRET_KEY":"change-me-secret-key"}' \
        --region "$AWS_DEFAULT_REGION"
    - echo "Secrets ready"
  only:
    - main

# ==========================
# STAGE 3 - INFRA CLUSTER
# eksctl config via python
# explicitly disables NAT
# NO heredocs used here
# ==========================

infra-eks:
  stage: infra-cluster
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  before_script:
    - yum install -y tar gzip python3
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
    - tar -xzf eksctl_Linux_amd64.tar.gz && mv eksctl /usr/local/bin/
    - curl -sLO https://get.helm.sh/helm-v3.14.0-linux-amd64.tar.gz
    - tar -xzf helm-v3.14.0-linux-amd64.tar.gz && mv linux-amd64/helm /usr/local/bin/
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - echo "Reading network IDs from SSM..."
    - |
      VPC_ID=$(aws ssm get-parameter --name "/ecommerce/vpc-id" --query "Parameter.Value" --output text)
      SUBNET_A=$(aws ssm get-parameter --name "/ecommerce/subnet-a" --query "Parameter.Value" --output text)
      SUBNET_B=$(aws ssm get-parameter --name "/ecommerce/subnet-b" --query "Parameter.Value" --output text)
      RDS_SG_ID=$(aws ssm get-parameter --name "/ecommerce/rds-sg-id" --query "Parameter.Value" --output text)
      echo "VPC:      $VPC_ID"
      echo "Subnet A: $SUBNET_A"
      echo "Subnet B: $SUBNET_B"

    - echo "Checking if EKS cluster exists..."
    - |
      VPC_ID=$(aws ssm get-parameter --name "/ecommerce/vpc-id" --query "Parameter.Value" --output text)
      SUBNET_A=$(aws ssm get-parameter --name "/ecommerce/subnet-a" --query "Parameter.Value" --output text)
      SUBNET_B=$(aws ssm get-parameter --name "/ecommerce/subnet-b" --query "Parameter.Value" --output text)

      CLUSTER_EXISTS=$(aws eks describe-cluster \
        --name "$CLUSTER_NAME" \
        --region "$AWS_DEFAULT_REGION" \
        --query "cluster.status" \
        --output text 2>&1 || echo "NOT_FOUND")

      if echo "$CLUSTER_EXISTS" | grep -q "NOT_FOUND\|ResourceNotFoundException"; then
        echo "Cluster not found. Creating with public nodes only - NO NAT gateway..."

        EKS_VERSION=$(aws eks describe-addon-versions \
          --query "sort_by(addons[0].addonVersions, &addonVersion)[-1].compatibilities[0].clusterVersion" \
          --output text 2>/dev/null || echo "1.32")
        echo "EKS version: $EKS_VERSION"

        export VPC_ID SUBNET_A SUBNET_B EKS_VERSION
        printf '%s\n' \
          "apiVersion: eksctl.io/v1alpha5" \
          "kind: ClusterConfig" \
          "metadata:" \
          "  name: ${CLUSTER_NAME}" \
          "  region: ${AWS_DEFAULT_REGION}" \
          "  version: \"${EKS_VERSION}\"" \
          "iam:" \
          "  withOIDC: true" \
          "vpc:" \
          "  id: ${VPC_ID}" \
          "  subnets:" \
          "    public:" \
          "      public-a:" \
          "        id: ${SUBNET_A}" \
          "      public-b:" \
          "        id: ${SUBNET_B}" \
          "  nat:" \
          "    gateway: Disable" \
          "managedNodeGroups:" \
          "  - name: backend-nodes" \
          "    instanceType: ${NODE_INSTANCE_TYPE}" \
          "    minSize: ${NODE_MIN}" \
          "    maxSize: ${NODE_MAX}" \
          "    desiredCapacity: ${NODE_DESIRED}" \
          "    amiFamily: AmazonLinux2" \
          "    subnets:" \
          "      - ${SUBNET_A}" \
          "      - ${SUBNET_B}" \
          "    iam:" \
          "      attachPolicyARNs:" \
          "        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy" \
          "        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy" \
          "        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly" \
          "        - arn:aws:iam::aws:policy/ElasticLoadBalancingFullAccess" \
          "    ssh:" \
          "      allow: false" \
          "addons:" \
          "  - name: vpc-cni" \
          "  - name: coredns" \
          "  - name: kube-proxy" \
          > /tmp/eksctl-config.yaml
        echo "eksctl config written successfully"

        echo "--- eksctl config preview ---"
        cat /tmp/eksctl-config.yaml
        echo "-----------------------------"
        eksctl create cluster -f /tmp/eksctl-config.yaml
        echo "EKS cluster created - public nodes only, no NAT gateway, no Elastic IPs"
      else
        echo "EKS cluster already exists - status: $CLUSTER_EXISTS"
      fi

    - echo "Updating kubeconfig..."
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"

    - echo "Verifying NO NAT gateways were created..."
    - |
      VPC_ID=$(aws ssm get-parameter --name "/ecommerce/vpc-id" --query "Parameter.Value" --output text)
      NAT_CHECK=$(aws ec2 describe-nat-gateways \
        --filter "Name=vpc-id,Values=$VPC_ID" "Name=state,Values=available,pending" \
        --query "NatGateways[*].NatGatewayId" --output text 2>/dev/null || echo "")
      if [ -n "$NAT_CHECK" ]; then
        echo "WARNING: NAT gateway detected: $NAT_CHECK"
        echo "Deleting to avoid costs..."
        for NAT_ID in $NAT_CHECK; do
          aws ec2 delete-nat-gateway --nat-gateway-id "$NAT_ID" || true
          echo "Deleted NAT gateway: $NAT_ID"
        done
      else
        echo "CONFIRMED: No NAT gateways exist - no unnecessary costs"
      fi

    - echo "Verifying NO unattached Elastic IPs exist..."
    - |
      UNATTACHED_EIPS=$(aws ec2 describe-addresses \
        --query "Addresses[?AssociationId==null].AllocationId" \
        --output text 2>/dev/null || echo "")
      if [ -n "$UNATTACHED_EIPS" ]; then
        echo "WARNING: Unattached Elastic IPs found: $UNATTACHED_EIPS"
        echo "Releasing to avoid costs..."
        for EIP in $UNATTACHED_EIPS; do
          aws ec2 release-address --allocation-id "$EIP" || true
          echo "Released EIP: $EIP"
        done
      else
        echo "CONFIRMED: No unattached Elastic IPs - no unnecessary costs"
      fi

    - echo "Installing AWS Load Balancer Controller..."
    - |
      VPC_ID=$(aws ssm get-parameter --name "/ecommerce/vpc-id" --query "Parameter.Value" --output text)
      POLICY_ARN=$(aws iam list-policies \
        --query "Policies[?PolicyName=='AWSLoadBalancerControllerIAMPolicy'].Arn" \
        --output text 2>/dev/null || echo "")

      if [ -z "$POLICY_ARN" ]; then
        curl -sLO https://raw.githubusercontent.com/kubernetes-sigs/aws-load-balancer-controller/main/docs/install/iam_policy.json
        POLICY_ARN=$(aws iam create-policy \
          --policy-name AWSLoadBalancerControllerIAMPolicy \
          --policy-document file://iam_policy.json \
          --query "Policy.Arn" --output text)
        echo "ALB IAM policy created: $POLICY_ARN"
      else
        echo "ALB IAM policy already exists: $POLICY_ARN"
      fi

      eksctl create iamserviceaccount \
        --cluster "$CLUSTER_NAME" \
        --namespace kube-system \
        --name aws-load-balancer-controller \
        --attach-policy-arn "$POLICY_ARN" \
        --approve \
        --override-existing-serviceaccounts || true

      helm repo add eks https://aws.github.io/eks-charts
      helm repo update
      helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
        --namespace kube-system \
        --set clusterName="$CLUSTER_NAME" \
        --set serviceAccount.create=false \
        --set serviceAccount.name=aws-load-balancer-controller \
        --set region="$AWS_DEFAULT_REGION" \
        --set vpcId="$VPC_ID" \
        --wait || true
      echo "ALB controller installed"

    - echo "Installing External Secrets Operator..."
    - |
      helm repo add external-secrets https://charts.external-secrets.io
      helm repo update
      helm upgrade --install external-secrets external-secrets/external-secrets \
        --namespace external-secrets \
        --create-namespace \
        --wait || true
      echo "External Secrets Operator installed"

    - echo "Creating ExternalSecrets IAM policy and service account..."
    - |
      POLICY_ESO_ARN=$(aws iam list-policies \
        --query "Policies[?PolicyName=='ExternalSecretsPolicy'].Arn" \
        --output text 2>/dev/null || echo "")

      if [ -z "$POLICY_ESO_ARN" ]; then
        printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["secretsmanager:GetSecretValue","secretsmanager:DescribeSecret"],"Resource":"*"}]}' > /tmp/eso-policy.json
        POLICY_ESO_ARN=$(aws iam create-policy \
          --policy-name ExternalSecretsPolicy \
          --policy-document file:///tmp/eso-policy.json \
          --query "Policy.Arn" --output text)
        echo "ExternalSecrets IAM policy created"
      else
        echo "ExternalSecrets IAM policy already exists"
      fi

      eksctl create iamserviceaccount \
        --cluster "$CLUSTER_NAME" \
        --namespace external-secrets \
        --name external-secrets-sa \
        --attach-policy-arn "$POLICY_ESO_ARN" \
        --approve \
        --override-existing-serviceaccounts || true

    - echo "Creating ClusterSecretStore..."
    - |
      printf '%s\n' \
        "apiVersion: external-secrets.io/v1beta1" \
        "kind: ClusterSecretStore" \
        "metadata:" \
        "  name: aws-secrets-manager" \
        "spec:" \
        "  provider:" \
        "    aws:" \
        "      service: SecretsManager" \
        "      region: ${AWS_DEFAULT_REGION}" \
        "      auth:" \
        "        jwt:" \
        "          serviceAccountRef:" \
        "            name: external-secrets-sa" \
        "            namespace: external-secrets" \
        > /tmp/cluster-secret-store.yaml
      kubectl apply -f /tmp/cluster-secret-store.yaml
      echo "ClusterSecretStore created"

    - echo "Granting EKS nodes access to RDS security group..."
    - |
      RDS_SG_ID=$(aws ssm get-parameter --name "/ecommerce/rds-sg-id" --query "Parameter.Value" --output text)
      EKS_NODE_SG=$(aws eks describe-cluster \
        --name "$CLUSTER_NAME" \
        --query "cluster.resourcesVpcConfig.clusterSecurityGroupId" \
        --output text)

      RULE_EXISTS=$(aws ec2 describe-security-group-rules \
        --filters \
          "Name=group-id,Values=$RDS_SG_ID" \
          "Name=ip-permission.to-port,Values=3306" \
          "Name=ip-permission.from-port,Values=3306" \
          "Name=ip-permission.protocol,Values=tcp" \
          "Name=ip-permission.user-id-group-pairs.group-id,Values=$EKS_NODE_SG" \
        --query "SecurityGroupRules" --output text 2>/dev/null || echo "")

      if [ -z "$RULE_EXISTS" ]; then
        aws ec2 authorize-security-group-ingress \
          --group-id "$RDS_SG_ID" \
          --protocol tcp \
          --port 3306 \
          --source-group "$EKS_NODE_SG" || true
        echo "RDS port 3306 opened for EKS nodes"
      else
        echo "RDS rule already exists"
      fi

    - echo "Final cost check..."
    - |
      VPC_ID=$(aws ssm get-parameter --name "/ecommerce/vpc-id" --query "Parameter.Value" --output text)
      NAT_FINAL=$(aws ec2 describe-nat-gateways \
        --filter "Name=vpc-id,Values=$VPC_ID" "Name=state,Values=available,pending" \
        --query "NatGateways[*].NatGatewayId" --output text 2>/dev/null || echo "none")
      EIP_FINAL=$(aws ec2 describe-addresses \
        --query "Addresses[?AssociationId==null].PublicIp" \
        --output text 2>/dev/null || echo "none")
      echo "NAT Gateways in VPC: ${NAT_FINAL:-none}"
      echo "Unattached Elastic IPs: ${EIP_FINAL:-none}"
      echo "Cluster is ready with zero NAT/EIP costs"
    - kubectl get nodes
    - echo "EKS cluster fully ready"
  timeout: 40m
  only:
    - main

# ==========================
# STAGE 4 - BUILD
# ==========================

build-backend:
  stage: build
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: ["infra-ecr", "infra-eks", "validate-docker", "validate-python-code"]
  before_script:
    - yum install -y docker
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - echo "Image pushed to ECR successfully"
  only:
    - main

# ==========================
# STAGE 5 - DEPLOY
# ==========================

deploy-backend:
  stage: deploy
  image:
    name: amazon/aws-cli
    entrypoint: [""]
  needs: ["build-backend"]
  before_script:
    - yum install -y tar gzip gettext jq python3
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"
  script:
    - echo "Reading SSM values and generating manifests..."
    - |
      SUBNET_A=$(aws ssm get-parameter --name "/ecommerce/subnet-a" --query "Parameter.Value" --output text)
      SUBNET_B=$(aws ssm get-parameter --name "/ecommerce/subnet-b" --query "Parameter.Value" --output text)
      export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      export SUBNET_A SUBNET_B

      FRONTEND_URL=$(aws cloudformation describe-stacks \
        --stack-name frontend-stack \
        --query "Stacks[0].Outputs[?OutputKey=='FrontendURL'].OutputValue" \
        --output text 2>/dev/null || echo "http://localhost:4200")
      export FRONTEND_URL
      echo "Frontend URL: $FRONTEND_URL"
      echo "Subnet A:     $SUBNET_A"
      echo "Subnet B:     $SUBNET_B"

      printf '%s\n' \
        "apiVersion: external-secrets.io/v1beta1" \
        "kind: ExternalSecret" \
        "metadata:" \
        "  name: backend-secrets" \
        "  namespace: default" \
        "spec:" \
        "  refreshInterval: 1h" \
        "  secretStoreRef:" \
        "    name: aws-secrets-manager" \
        "    kind: ClusterSecretStore" \
        "  target:" \
        "    name: backend-secrets" \
        "    creationPolicy: Owner" \
        "  data:" \
        "  - secretKey: DB_USER" \
        "    remoteRef:" \
        "      key: rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab" \
        "      property: username" \
        "  - secretKey: DB_PASSWORD" \
        "    remoteRef:" \
        "      key: rds!db-a31a37c1-ddb2-4685-a5c6-dbd11475e1ab" \
        "      property: password" \
        "  - secretKey: JWT_SECRET_KEY" \
        "    remoteRef:" \
        "      key: secrets/backend/app" \
        "      property: JWT_SECRET_KEY" \
        "  - secretKey: SECRET_KEY" \
        "    remoteRef:" \
        "      key: secrets/backend/app" \
        "      property: SECRET_KEY" \
        > /tmp/external-secret.yaml

      printf '%s\n' \
        "apiVersion: apps/v1" \
        "kind: Deployment" \
        "metadata:" \
        "  name: backend" \
        "  namespace: default" \
        "spec:" \
        "  replicas: 1" \
        "  selector:" \
        "    matchLabels:" \
        "      app: backend" \
        "  template:" \
        "    metadata:" \
        "      labels:" \
        "        app: backend" \
        "    spec:" \
        "      containers:" \
        "      - name: backend" \
        "        image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${BACKEND_REPO}:${IMAGE_TAG}" \
        "        ports:" \
        "        - containerPort: 5000" \
        "        env:" \
        "        - name: DB_HOST" \
        "          value: \"${RDS_ENDPOINT}\"" \
        "        - name: DB_NAME" \
        "          value: ecommerce_db" \
        "        - name: FLASK_ENV" \
        "          value: production" \
        "        - name: CORS_ORIGINS" \
        "          value: \"${FRONTEND_URL}\"" \
        "        - name: DB_USER" \
        "          valueFrom:" \
        "            secretKeyRef:" \
        "              name: backend-secrets" \
        "              key: DB_USER" \
        "        - name: DB_PASSWORD" \
        "          valueFrom:" \
        "            secretKeyRef:" \
        "              name: backend-secrets" \
        "              key: DB_PASSWORD" \
        "        - name: JWT_SECRET_KEY" \
        "          valueFrom:" \
        "            secretKeyRef:" \
        "              name: backend-secrets" \
        "              key: JWT_SECRET_KEY" \
        "        - name: SECRET_KEY" \
        "          valueFrom:" \
        "            secretKeyRef:" \
        "              name: backend-secrets" \
        "              key: SECRET_KEY" \
        "        resources:" \
        "          requests:" \
        "            cpu: 256m" \
        "            memory: 512Mi" \
        "---" \
        "apiVersion: v1" \
        "kind: Service" \
        "metadata:" \
        "  name: backend" \
        "  namespace: default" \
        "spec:" \
        "  type: ClusterIP" \
        "  selector:" \
        "    app: backend" \
        "  ports:" \
        "  - port: 5000" \
        "    targetPort: 5000" \
        "    protocol: TCP" \
        "---" \
        "apiVersion: networking.k8s.io/v1" \
        "kind: Ingress" \
        "metadata:" \
        "  name: backend" \
        "  namespace: default" \
        "  annotations:" \
        "    kubernetes.io/ingress.class: alb" \
        "    alb.ingress.kubernetes.io/scheme: internet-facing" \
        "    alb.ingress.kubernetes.io/target-type: ip" \
        "    alb.ingress.kubernetes.io/subnets: ${SUBNET_A},${SUBNET_B}" \
        "    alb.ingress.kubernetes.io/listen-ports: '[{\"HTTP\": 80}]'" \
        "    alb.ingress.kubernetes.io/healthcheck-path: /health" \
        "spec:" \
        "  rules:" \
        "  - http:" \
        "      paths:" \
        "      - path: /" \
        "        pathType: Prefix" \
        "        backend:" \
        "          service:" \
        "            name: backend" \
        "            port:" \
        "              number: 5000" \
        > /tmp/backend-deployment.yaml
      echo "All manifests written successfully"

      kubectl apply -f /tmp/external-secret.yaml
      kubectl apply -f /tmp/backend-deployment.yaml
      kubectl rollout status deployment/backend -n default --timeout=300s
      echo "Backend deployed successfully"

    - echo "Waiting for ALB to provision..."
    - |
      for i in $(seq 1 120); do
        BACKEND_URL=$(kubectl get ingress backend -n default \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -n "$BACKEND_URL" ]; then
          echo "BACKEND LIVE AT: http://$BACKEND_URL"
          break
        fi
        echo "Attempt $i/120 - waiting for ALB..."
        sleep 5
      done
  only:
    - main