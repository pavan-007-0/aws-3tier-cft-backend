image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  BACKEND_STACK: backend-stack

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - aws sts get-caller-identity
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

# ================= BUILD & PUSH =================
build-backend:
  stage: build
  script:
    - |
      aws ecr describe-repositories \
        --repository-names "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION" \
      || aws ecr create-repository \
        --repository-name "$BACKEND_REPO" \
        --region "$AWS_DEFAULT_REGION"

    - |
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | \
      docker login --username AWS --password-stdin \
      "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"

    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .

    - export IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"

    - docker tag "$BACKEND_REPO:$IMAGE_TAG" "$IMAGE_URI"
    - docker push "$IMAGE_URI"
  only:
    - main

# ================= DEPLOY =================
deploy-backend:
  stage: deploy
  needs: ["build-backend"]
  script:
    - |
      cat > backend-infra.yaml << 'EOF'
      AWSTemplateFormatVersion: "2010-09-09"
      Description: Backend ECS Fargate with ALB + RDS Secrets

      Parameters:
        ImageURI:
          Type: String

      Resources:
        VPC:
          Type: AWS::EC2::VPC
          Properties:
            CidrBlock: 10.1.0.0/16
            EnableDnsSupport: true
            EnableDnsHostnames: true

        IGW:
          Type: AWS::EC2::InternetGateway

        IGWAttach:
          Type: AWS::EC2::VPCGatewayAttachment
          Properties:
            VpcId: !Ref VPC
            InternetGatewayId: !Ref IGW

        Subnet1:
          Type: AWS::EC2::Subnet
          Properties:
            VpcId: !Ref VPC
            CidrBlock: 10.1.1.0/24
            MapPublicIpOnLaunch: true
            AvailabilityZone: us-east-1a

        Subnet2:
          Type: AWS::EC2::Subnet
          Properties:
            VpcId: !Ref VPC
            CidrBlock: 10.1.2.0/24
            MapPublicIpOnLaunch: true
            AvailabilityZone: us-east-1b

        RouteTable:
          Type: AWS::EC2::RouteTable
          Properties:
            VpcId: !Ref VPC

        Route:
          Type: AWS::EC2::Route
          DependsOn: IGWAttach
          Properties:
            RouteTableId: !Ref RouteTable
            DestinationCidrBlock: 0.0.0.0/0
            GatewayId: !Ref IGW

        Subnet1RT:
          Type: AWS::EC2::SubnetRouteTableAssociation
          Properties:
            SubnetId: !Ref Subnet1
            RouteTableId: !Ref RouteTable

        Subnet2RT:
          Type: AWS::EC2::SubnetRouteTableAssociation
          Properties:
            SubnetId: !Ref Subnet2
            RouteTableId: !Ref RouteTable

        ALBSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: ALB SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 80
                ToPort: 80
                CidrIp: 0.0.0.0/0

        TaskSG:
          Type: AWS::EC2::SecurityGroup
          Properties:
            GroupDescription: ECS Task SG
            VpcId: !Ref VPC
            SecurityGroupIngress:
              - IpProtocol: tcp
                FromPort: 5000
                ToPort: 5000
                SourceSecurityGroupId: !Ref ALBSG

        Cluster:
          Type: AWS::ECS::Cluster

        ExecutionRole:
          Type: AWS::IAM::Role
          Properties:
            AssumeRolePolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ecs-tasks.amazonaws.com
                  Action: sts:AssumeRole
            ManagedPolicyArns:
              - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

        TaskDef:
          Type: AWS::ECS::TaskDefinition
          Properties:
            Cpu: "256"
            Memory: "512"
            NetworkMode: awsvpc
            RequiresCompatibilities: [FARGATE]
            ExecutionRoleArn: !GetAtt ExecutionRole.Arn
            ContainerDefinitions:
              - Name: backend
                Image: !Ref ImageURI
                PortMappings:
                  - ContainerPort: 5000
                Environment:
                  - Name: FLASK_ENV
                    Value: production
                Secrets:
                  - Name: DB_HOST
                    ValueFrom: "arn:aws:secretsmanager:us-east-1:088042034531:secret:rds!db-06783279-a268-42c4-884b-7f7475c0ad62:host::"
                  - Name: DB_USER
                    ValueFrom: "arn:aws:secretsmanager:us-east-1:088042034531:secret:rds!db-06783279-a268-42c4-884b-7f7475c0ad62:username::"
                  - Name: DB_PASSWORD
                    ValueFrom: "arn:aws:secretsmanager:us-east-1:088042034531:secret:rds!db-06783279-a268-42c4-884b-7f7475c0ad62:password::"
                  - Name: DB_NAME
                    Value: ecommerce_db

        TG:
          Type: AWS::ElasticLoadBalancingV2::TargetGroup
          Properties:
            Port: 5000
            Protocol: HTTP
            TargetType: ip
            VpcId: !Ref VPC
            HealthCheckPath: /health

        ALB:
          Type: AWS::ElasticLoadBalancingV2::LoadBalancer
          Properties:
            Scheme: internet-facing
            Subnets: [!Ref Subnet1, !Ref Subnet2]
            SecurityGroups: [!Ref ALBSG]

        Listener:
          Type: AWS::ElasticLoadBalancingV2::Listener
          Properties:
            LoadBalancerArn: !Ref ALB
            Port: 80
            Protocol: HTTP
            DefaultActions:
              - Type: forward
                TargetGroupArn: !Ref TG

        Service:
          Type: AWS::ECS::Service
          DependsOn: Listener
          Properties:
            Cluster: !Ref Cluster
            LaunchType: FARGATE
            DesiredCount: 1
            TaskDefinition: !Ref TaskDef
            NetworkConfiguration:
              AwsvpcConfiguration:
                AssignPublicIp: ENABLED
                Subnets: [!Ref Subnet1, !Ref Subnet2]
                SecurityGroups: [!Ref TaskSG]
            LoadBalancers:
              - ContainerName: backend
                ContainerPort: 5000
                TargetGroupArn: !Ref TG

      Outputs:
        BackendURL:
          Value: !GetAtt ALB.DNSName
      EOF

    - |
      aws cloudformation deploy \
        --stack-name "$BACKEND_STACK" \
        --template-file backend-infra.yaml \
        --capabilities CAPABILITY_NAMED_IAM \
        --parameter-overrides \
          ImageURI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"

  only:
    - main
