image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_REGION: ap-south-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

stages:
  - build
  - deploy

before_script:
  # Install AWS CLI
  - apk add --no-cache aws-cli

  # Verify AWS identity
  - aws sts get-caller-identity

  # Export AWS Account ID
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

  # Login to Amazon ECR
  - aws ecr get-login-password --region $AWS_REGION |
    docker login --username AWS --password-stdin
    $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

build_backend:
  stage: build
  script:
    # Build backend image (Dockerfile is inside backend_ecommerce/)
    - docker build
      -f backend_ecommerce/Dockerfile
      -t $BACKEND_REPO:$IMAGE_TAG
      backend_ecommerce

    # Tag image for ECR
    - docker tag $BACKEND_REPO:$IMAGE_TAG
      $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG

    # Push image to ECR
    - docker push
      $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG

deploy_backend:
  stage: deploy
  script:
    # Force ECS service to redeploy latest image
    - aws ecs update-service
      --cluster backend-cluster
      --service backend-service
      --force-new-deployment
      --region $AWS_REGION
  only:
    - main
