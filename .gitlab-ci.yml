stages:
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: us-east-1
  BACKEND_REPO: backend-repo
  IMAGE_TAG: latest
  CLUSTER_NAME: ecommerce-cluster
  VPC_ID: "vpc-0c94c781bb54a1008"
  SUBNET_A: "subnet-0951f168b0769217c"
  SUBNET_B: "subnet-0a61c37122c11d0f1"
  RDS_SG_ID: "sg-0f5f53246f5b20572"

# ================= BUILD =================
build-backend:
  stage: build
  image: amazon/aws-cli          # ✅ AWS CLI already installed, no conflicts
  services:
    - docker:24-dind              # Docker daemon runs as a sidecar service
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - amazon-linux-extras install docker -y || yum install -y docker  # install docker CLI
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  script:
    - aws ecr describe-repositories --repository-names "$BACKEND_REPO" \
        || aws ecr create-repository --repository-name "$BACKEND_REPO"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" \
        | docker login --username AWS --password-stdin \
          "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
    - docker build -t "$BACKEND_REPO:$IMAGE_TAG" .
    - docker tag "$BACKEND_REPO:$IMAGE_TAG" \
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
    - docker push \
        "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG"
  only:
    - main

# ================= DEPLOY =================
deploy-backend:
  stage: deploy
  image: amazon/aws-cli          # ✅ same image, no Docker daemon needed here
  needs: ["build-backend"]
  before_script:
    - yum install -y curl tar gzip gettext jq
    - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
    - curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_DEFAULT_REGION"
  script:
    # ---- rest of your existing deploy script, completely unchanged ----
    - |
      echo "🔐 Authorizing EKS nodes to access RDS..."
      EKS_NODE_SG=$(aws eks describe-cluster --name "$CLUSTER_NAME" \
        --query "cluster.resourcesVpcConfig.clusterSecurityGroupId" --output text)
      RULE_EXISTS=$(aws ec2 describe-security-group-rules \
        --filters \
          Name="group-id",Values="$RDS_SG_ID" \
          Name="ip-permission.to-port",Values="3306" \
          Name="ip-permission.from-port",Values="3306" \
          Name="ip-permission.protocol",Values="tcp" \
          Name="ip-permission.user-id-group-pairs.group-id",Values="$EKS_NODE_SG" \
        --query "SecurityGroupRules" --output text)
      if [ -z "$RULE_EXISTS" ]; then
        aws ec2 authorize-security-group-ingress \
          --group-id "$RDS_SG_ID" --protocol tcp --port 3306 \
          --source-group "$EKS_NODE_SG" || true
      fi
    - |
      FRONTEND_URL=$(aws cloudformation describe-stacks \
        --stack-name frontend-stack \
        --query "Stacks[0].Outputs[?OutputKey=='FrontendURL'].OutputValue" \
        --output text || echo "http://localhost:4200")
    - |
      cat > backend-manifests.yaml << EOF
      # ... your existing manifest heredoc unchanged ...
      EOF
      kubectl apply -f backend-manifests.yaml
      kubectl rollout status deployment/backend -n default --timeout=300s
    - |
      for i in {1..120}; do
        BACKEND_URL=$(kubectl get ingress backend -n default \
          -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
        if [ -n "$BACKEND_URL" ]; then
          echo "🎉 BACKEND LIVE AT: http://$BACKEND_URL"
          break
        fi
        sleep 5
      done
  only:
    - main