image: docker:24

services:
  - docker:24-dind

variables:
  DOCKER_TLS_CERTDIR: ""
  BACKEND_REPO: backend-repo
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

stages:
  - build
  - deploy

before_script:
  - apk add --no-cache aws-cli
  - aws sts get-caller-identity
  - export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
  - aws ecr get-login-password --region $AWS_REGION |
    docker login --username AWS --password-stdin
    $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

build_backend:
  stage: build
  script:
    - docker build -f backend_ecommerce/Dockerfile -t $BACKEND_REPO:$IMAGE_TAG backend_ecommerce
    - docker tag $BACKEND_REPO:$IMAGE_TAG $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG
    - docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_REPO:$IMAGE_TAG

deploy_backend:
  stage: deploy
  script:
    - aws ecs update-service \
        --cluster backend-cluster \
        --service backend-service \
        --force-new-deployment \
        --region $AWS_REGION
  only:
    - main
